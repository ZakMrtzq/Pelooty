<style>

  :root{
    --bg:#160C14; --bg2:#24121F;
    --card:#2A1726; --card2:#351D30; --line:#513047; --line2:#704361;
    --ink:#FFF3FA; --muted:#C9A6BD;
    --accent:#FF85BD; --accent2:#F75DA8; --accent-dim:#60334C; --accent-soft:rgba(255,133,189,.14);
    --done:#6FD9A0; --done-dim:#24463A;
    --blue:#8FB8E8;
    --r:20px; --r-sm:13px; --pad:18px;
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1}
  body{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:calc(44px + env(safe-area-inset-bottom));overflow-x:hidden;
    background:
      radial-gradient(110% 46% at 50% -6%, #4A2039 0%, transparent 60%),
      radial-gradient(90% 40% at 50% 108%, #32172D 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  input,textarea{font-size:16px}
  ::selection{background:var(--accent-soft)}
  ::-webkit-scrollbar{width:0;height:0}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,217,160,.55)}70%{box-shadow:0 0 0 7px rgba(111,217,160,0)}100%{box-shadow:0 0 0 0 rgba(111,217,160,0)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(4deg)}}
  @keyframes shim{0%{background-position:-140px 0}100%{background-position:220px 0}}
  @keyframes glowp{0%,100%{box-shadow:0 0 14px rgba(255,133,189,.45)}50%{box-shadow:0 0 26px rgba(255,133,189,.8)}}
  @keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

  /* ===== header ===== */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px var(--pad) 10px;
    background:rgba(22,12,20,.88);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-bottom:1px solid rgba(255,255,255,.05)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .dot{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:21px;
    animation:floaty 4.5s ease-in-out infinite;filter:drop-shadow(0 3px 10px rgba(255,133,189,.35))}
  .brand h1{font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sbtn{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .12s}
  .sbtn:active{transform:scale(.9)}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .live .b{width:7px;height:7px;border-radius:50%;background:#5b4f58}
  .live.on .b{background:var(--done);animation:pulse 2s infinite}
  .wk{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
  .wk button{width:30px;height:30px;border-radius:999px;color:var(--muted);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .wk button:active{background:var(--card2);color:var(--accent);transform:scale(.9)}
  .wk .lab{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding:0 7px;min-width:62px;text-align:center}
  .wk .lab b{color:var(--ink)}
  .clockbar{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em;padding:9px 0 2px}
  .presbar{display:none;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:2px 12px 10px;font-size:12px;color:var(--muted)}
  .pchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pchip b{color:var(--ink);font-weight:650}
  .pchip .plbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
  .pchip .pdot{margin-right:0}
  .pchip.perr{border-color:#7a3b3b;color:#e8a0a0}
  .pchip.psend{border-color:var(--accent);color:var(--ink);cursor:pointer;transition:transform .1s}
  .pchip.psend:active{transform:scale(.94)}
  .stoast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9500;background:var(--card2);border:1px solid var(--accent);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.45);pointer-events:none}

  /* ===== screens ===== */

  @media (prefers-reduced-motion:reduce){.screen,.day,.ex,.gcard,.klev,.brand .dot,.crit{animation:none!important}*{transition-duration:.01ms!important}}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:10px 2px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* ===== day cards ===== */
  .days{display:flex;flex-direction:column;gap:11px}
  .day{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--card2),var(--card));

    box-shadow:var(--shadow);transition:transform .14s cubic-bezier(.2,.8,.3,1),border-color .14s;animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards}
  .day:active{transform:scale(.975);border-color:var(--accent-dim)}
  .ring{width:50px;height:50px;border-radius:15px;flex:0 0 auto;padding:3px;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*3.6deg),var(--line) 0);transition:background .5s}
  .ring.full{background:conic-gradient(var(--done) 360deg,var(--done) 0);animation:glowp 2.6s ease-in-out infinite}
  .day .ix{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--bg2)}

  .day .body{flex:1;min-width:0}

  .day .body .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center}
  .pill{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .pill.hyp{background:var(--accent-soft);color:var(--accent)}
  .pill.neu{background:rgba(111,217,160,.12);color:var(--done)}
  .pill.rest{background:rgba(143,184,232,.12);color:var(--blue)}
  .day .meta{flex:0 0 auto;text-align:right}
  .day .meta .big{font-size:18px;font-weight:800}
  .day .meta .cap{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
  .chev{color:var(--muted);font-size:20px;flex:0 0 auto;opacity:.7}

  /* ===== session ===== */
  .back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;padding:8px 0 4px;transition:color .12s}

  .shead .date{font-size:12px;color:var(--muted);white-space:nowrap}
  .ex{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards;transition:border-color .2s}
  .ex.open{border-color:var(--line2)}
  .ex .row{display:flex;align-items:center;gap:12px;padding:15px 16px;width:100%;text-align:left}
  .ex .nm{flex:1;min-width:0}
  .ex .nm .t{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .ex .nm .tg{font-size:12px;color:var(--muted);margin-top:3px}
  .badge{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
    background:var(--bg2);color:var(--muted);white-space:nowrap;transition:all .2s}
  .badge.hit{background:var(--done-dim);color:var(--done);animation:popin .35s cubic-bezier(.2,1.4,.3,1)}
  .ex .panel{border-top:1px solid var(--line);padding:15px 16px 16px;display:none;background:rgba(0,0,0,.16)}
  .ex.open .panel{display:block;animation:fade .25s ease}
  .chev2{color:var(--muted);font-size:18px;transition:transform .2s cubic-bezier(.2,.8,.3,1);opacity:.7}
  .ex.open .chev2{transform:rotate(90deg);color:var(--accent);opacity:1}
  .sub-h{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
  .coach-edit{display:grid;grid-template-columns:minmax(110px,1fr) 56px 56px 74px;gap:8px;margin-bottom:15px;align-items:end}
  @media (max-width:370px){.coach-edit{grid-template-columns:1fr 1fr}}
  .cfield{display:flex;flex-direction:column;gap:5px;min-width:0}
  .cfield label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .cfield input,.cfield select{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;font-size:16px;font-weight:600;width:100%;transition:border-color .15s}
  .cfield input:focus,.cfield select:focus{outline:none;border-color:var(--accent)}
  .sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
  .set{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:border-color .15s}
  .set:focus-within{border-color:var(--accent)}
  .set .sx{font-size:12px;color:var(--muted);padding:0 8px}
  .set button{width:36px;height:42px;font-size:18px;font-weight:600;color:var(--muted);transition:all .1s}
  .set button:active{background:var(--card2);color:var(--accent);transform:scale(.88)}
  .set .v{min-width:30px;text-align:center;font-size:16px;font-weight:800}
  .set .v.ok{color:var(--done)}
  .set .vIn{width:52px;height:42px;text-align:center;font-size:16px;font-weight:800;background:transparent;border:none;-moz-appearance:textfield}
  .set .vIn::-webkit-outer-spin-button,.set .vIn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .set .vIn:focus{outline:none;background:var(--card2)}
  .set .vIn.ok{color:var(--done)}
  .set .su{font-size:12px;color:var(--muted);padding:0 8px 0 2px}
  .set .rm{width:30px;height:42px;color:var(--accent2);font-size:14px;opacity:.75}
  .addset{height:42px;padding:0 15px;border:1px dashed var(--line2);border-radius:13px;color:var(--muted);font-size:13px;font-weight:700;transition:all .15s}
  .addset:active{border-color:var(--accent);color:var(--accent);transform:scale(.96)}
  .vol{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border-radius:13px;padding:12px 14px;border:1px solid var(--line)}
  .vol .l{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .vol .r{font-size:16px;font-weight:800}
  .vol .r .of{color:var(--muted);font-weight:600;font-size:13px}
  .hint{font-size:12px;margin-top:10px;padding:11px 13px;border-radius:11px;line-height:1.5;transition:all .25s}
  .hint.go{background:var(--done-dim);color:#BFEFD4}
  .hint.wait{background:var(--card2);color:var(--muted)}
  .pnote{margin-top:14px}
  .pnote h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .pnote textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;line-height:1.5;resize:vertical;min-height:52px;transition:border-color .15s}
  .pnote textarea:focus{outline:none;border-color:var(--accent)}
  .pnote+.pnote{margin-top:10px}
  .exdel{margin-top:14px;text-align:right}
  .exdel button{color:var(--accent2);font-size:12px;font-weight:700;opacity:.85}
  .addex{width:100%;border:1px dashed var(--line2);border-radius:var(--r);padding:15px;color:var(--muted);font-size:14px;font-weight:700;margin-bottom:12px;transition:all .15s}
  .addex:active{border-color:var(--accent);color:var(--accent);transform:scale(.985)}
  .addform{background:var(--card2);border:1px solid var(--accent-dim);border-radius:var(--r);padding:16px;margin-bottom:12px;animation:rise .3s ease;box-shadow:var(--shadow)}
  .addform .fr{display:flex;gap:8px;margin-bottom:10px}
  .addform input{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px;width:100%}
  .addform input:focus{outline:none;border-color:var(--accent)}
  .addform .w{width:74px;flex:0 0 auto;text-align:center}
  .addform .acts{display:flex;gap:8px;justify-content:flex-end}
  .addform .acts button{padding:9px 18px;border-radius:11px;font-size:13px;font-weight:800}
  .addform .save{background:var(--grad);color:#2B1020}
  .addform .cancel{color:var(--muted)}

  /* ===== home extras / games ===== */
  .gcard{display:flex;align-items:center;gap:14px;width:100%;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;text-align:left;margin-top:11px;
    box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards;transition:transform .14s,border-color .14s}

  .gcard .gt{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .gcard .gs{font-size:12px;color:var(--muted);margin-top:3px}
  .cbadge{background:var(--grad);color:#2B1020;font-size:12px;font-weight:800;min-width:19px;height:19px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;animation:popin .3s ease}
  .gbar{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:var(--muted)}
  .gbar b{color:var(--ink);font-size:18px;font-weight:800;margin-left:4px}
  .result{text-align:center;padding:26px 10px;animation:rise .4s ease}
  .result .rscore{font-size:56px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .result .rcap{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .lb{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin:18px auto 0;max-width:340px;text-align:left;box-shadow:var(--shadow)}

  .lb-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .lb-row b{color:var(--accent)}

  .lbv i{font-style:normal;font-size:12px;color:var(--muted)}
  .lb-empty{font-size:13px;color:var(--muted)}
  .racts{display:flex;gap:9px;justify-content:center;margin-top:18px}
  .racts button{padding:11px 22px;border-radius:13px;font-size:14px;font-weight:800;transition:transform .12s}
  .racts button:active{transform:scale(.94)}
  .racts .save{background:var(--grad);color:#2B1020;box-shadow:0 6px 18px rgba(247,93,168,.3)}
  .racts .cancel{color:var(--muted)}
  .rxn{width:100%;height:46vh;border-radius:var(--r);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;transition:background .12s,transform .12s;box-shadow:var(--shadow)}
  .rxn:active{transform:scale(.99)}
  .rxn.wait{background:var(--card2);color:var(--muted)}
  .rxn.go{background:var(--grad);color:#2B1020}

  .rxn.done{background:var(--done-dim);color:#BFEFD4}

  .tstatus{text-align:center;font-size:15px;font-weight:800;margin:2px 0 4px;min-height:22px}
  .ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:310px;margin:14px auto}
  .tcell{aspect-ratio:1;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;font-size:40px;display:flex;align-items:center;justify-content:center;transition:transform .1s,border-color .12s;box-shadow:var(--shadow)}

  .holdpad{width:100%;height:44vh;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));

    touch-action:none;-webkit-user-select:none;user-select:none;transition:background .2s,transform .12s}

  /* ===== kegel ===== */

  .hrow span:first-child{color:var(--ink);font-weight:700}
  .picker{position:fixed;inset:0;z-index:9000;background:rgba(8,5,9,.66);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}

.timer-dock{position:static;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border:1px solid var(--accent-dim);box-shadow:var(--shadow);border-radius:16px;font-size:14px}

.settings-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;font-size:15px;line-height:1.5}
.settings-row select{min-height:44px;max-width:52%;padding:8px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;font-size:15px}
.tool-status{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0}
#installHelp{margin-bottom:0}
.settings-card h3{font-size:17px;margin-bottom:6px}
#printReport{display:none}
@media(max-width:400px){.top-actions{gap:4px}.top{flex-wrap:wrap}.brand{min-width:110px}.app-notice{margin:8px 14px}.timer-dock .tool-button{padding:6px 8px}}
@media print{body>*{display:none!important}body>#printReport{display:block!important}html,body{background:white!important;color:#171717!important;max-width:none!important;padding:0!important}#printReport{font:11pt system-ui;color:#171717}#printReport h1{font-size:22pt}#printReport h2{font-size:15pt;margin:18pt 0 8pt}#printReport section{break-inside:avoid}#printReport table{border-collapse:collapse;width:100%;font-size:9pt}#printReport th,#printReport td{padding:6pt;border:1px solid #aaa;text-align:left;vertical-align:top}#printReport p{margin:8pt 0}}

.logged-set{min-width:0}.set-record{margin:6px 0 0;padding-left:4px;color:var(--muted,#c5a9ba);font-size:12px;line-height:1.5}

/* Per-set load and effort controls. */
.set-metadata{margin-top:6px;border:1px solid var(--line);border-radius:11px;background:var(--bg2);min-width:0}
.set-metadata summary{padding:9px 10px;min-height:44px;font-size:12px;line-height:1.5;color:var(--muted);cursor:pointer;font-weight:650;overflow-wrap:anywhere}
.set-metadata summary span{display:block;font-size:12px;font-weight:400;color:var(--ink);padding-top:3px}
.set-metadata[open] summary{border-bottom:1px solid var(--line)}
.set-meta-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;padding:12px 10px 4px;min-width:0}
.set-meta-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.set-meta-field label{font-size:12px;line-height:1.4;color:var(--muted)}
.set-meta-field input,.set-meta-field select{display:block;min-width:0;width:100%;min-height:44px;padding:9px 8px;border:1px solid var(--line2);border-radius:9px;background:var(--card);color:var(--ink);font-size:16px}
.set-meta-field input:disabled,.set-meta-field select:disabled{opacity:.5}
.set-meta-wide{grid-column:1/-1}
.set-meta-hint{padding:6px 10px 10px;color:var(--muted);font-size:11px;line-height:1.5}
.set-meta-error{margin:0;padding:0 10px 10px;font-size:12px;line-height:1.5;color:#FFB8D8}
@media(max-width:370px){.set-meta-fields{gap:8px}.set-meta-field label{font-size:11px}}
/* Comic notes are anchored to the exercise heading, independent of its panel. */
.ex{position:relative;overflow:visible}
.ex.note-open{z-index:25}
.exercise-heading{position:relative;display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0}
.ex .exercise-heading>.row{flex:1;min-width:0;padding:18px 0;gap:10px}
.ex .panel{border-radius:0 0 var(--r) var(--r)}
.comic-note{flex:0 0 auto}
.comic-note[hidden],.comic-note-popover[hidden]{display:none!important}
.comic-note-trigger{--bubble:#fff8fc;position:relative;display:grid;place-items:center;width:58px;height:46px;border:2.5px solid #382030;border-radius:47% 53% 48% 52%/51% 48% 52% 49%;background:var(--bubble);color:#382030;box-shadow:2px 3px 0 #160c14;transform:rotate(-5deg);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;isolation:isolate}
.comic-note.coach .comic-note-trigger{--bubble:#ffd6e9;transform:rotate(5deg)}
.comic-note-trigger>span{font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif;font-size:25px;line-height:1}
.comic-note-trigger:before,.comic-note-trigger:after{content:'';position:absolute;bottom:-9px;right:9px;width:0;height:0;border-style:solid;border-width:10px 1px 0 12px;border-color:#382030 transparent transparent transparent;transform:rotate(-12deg);z-index:-1}
.comic-note-trigger:after{bottom:-5px;right:11px;border-width:8px 0 0 8px;border-top-color:var(--bubble)}
.comic-note.coach .comic-note-trigger:before,.comic-note.coach .comic-note-trigger:after{right:auto;left:9px;transform:scaleX(-1) rotate(-12deg)}
.comic-note.coach .comic-note-trigger:after{left:11px}
@media(hover:hover){.comic-note-trigger:hover{transform:rotate(-5deg) scale(1.1);box-shadow:3px 5px 0 #160c14;filter:brightness(1.06)}.comic-note.coach .comic-note-trigger:hover{transform:rotate(5deg) scale(1.1)}}
.comic-note-trigger[aria-expanded=true]{transform:scale(1.08);box-shadow:0 0 0 3px rgba(255,133,189,.2),3px 4px 0 #160c14}
.comic-note-trigger:focus-visible,.comic-note-close:focus-visible{outline:3px solid #ff85bd;outline-offset:5px}
.comic-note-popover{--bubble:#fff8fc;position:absolute;top:8px;left:8px;width:min(25rem,calc(100% - 16px));max-height:min(28rem,65dvh,var(--comic-note-height,100vh));padding:13px 19px 22px;border:3px solid #382030;border-radius:30px 34px 29px 33px/29px 26px 32px 30px;background:var(--bubble);color:#382030;box-shadow:5px 6px 0 #160c14,0 14px 32px rgba(0,0,0,.3);z-index:3;transform-origin:30px 30px;animation:comic-note-open .18s cubic-bezier(.2,.8,.2,1);outline:none}
.comic-note.coach .comic-note-popover{--bubble:#ffd6e9;left:auto;right:8px;transform-origin:calc(100% - 30px) 30px}
.comic-note-popover:before,.comic-note-popover:after{content:'';position:absolute;bottom:-17px;left:28px;width:0;height:0;border-style:solid;border-width:19px 0 0 22px;border-color:#382030 transparent transparent transparent;transform:rotate(-9deg)}
.comic-note-popover:after{bottom:-11px;left:30px;border-width:15px 0 0 17px;border-top-color:var(--bubble)}
.comic-note.coach .comic-note-popover:before,.comic-note.coach .comic-note-popover:after{left:auto;right:28px;transform:scaleX(-1) rotate(-9deg)}
.comic-note.coach .comic-note-popover:after{right:30px}
.comic-note-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 5px}
.comic-note-animal{font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif;font-size:30px;line-height:1.2}
.comic-note-close{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#6d3a55;font-size:29px;line-height:1}
.comic-note-close:hover{background:rgba(115,44,77,.1)}
.comic-note-popover p{margin:0;max-height:calc(min(28rem,65dvh,var(--comic-note-height,100vh)) - 106px);overflow:auto;overscroll-behavior:contain;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.55}
@keyframes comic-note-open{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
.exercise-band-field{grid-column:1/-1}
.set-meta-field[hidden]{display:none!important}
@media(max-width:600px){.exercise-heading{padding:0 10px;gap:9px}.comic-note-trigger{width:46px;height:42px}.comic-note-trigger>span{font-size:23px}.ex .exercise-heading>.row{flex-wrap:wrap;gap:5px 7px;padding:16px 0}.exercise-heading .row>.nm{flex-basis:calc(100% - 18px);order:0}.exercise-heading .row>.chev2{order:1}.exercise-heading .row>.badge{order:2;font-size:10px;padding:3px 6px}.comic-note-popover{padding:10px 15px 20px}.comic-note-popover p{font-size:16px}}
@media(prefers-reduced-motion:reduce){.comic-note-trigger,.comic-note-popover{animation:none!important;transition:none!important}}

.backup-card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px;min-width:0}
.backup-card h3{font-size:18px;margin-bottom:12px}.backup-card p{color:var(--muted);font-size:14px;line-height:1.6;margin:12px 0 16px}
.backup-file-label{display:block;color:var(--muted);font-size:14px;margin:16px 0 9px}.backup-card input[type=file]{display:block;width:100%;min-height:44px;font-size:14px;color:var(--ink)}
.backup-card input[type=file]::file-selector-button{padding:10px 14px;margin-right:12px;min-height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink)}
.backup-table{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0}.backup-table caption{text-align:left;font-weight:700;padding:10px 0}.backup-table th,.backup-table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}.backup-table thead th{font-size:12px;color:var(--muted)}
.backup-preference{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.5;margin:18px 0}.backup-preference input{width:22px;height:22px;accent-color:var(--accent);flex:none}.backup-error{color:#ffb8d8!important}.backup-json-fallback{display:block;width:100%;height:200px;min-width:0;background:var(--bg2);color:var(--ink);border:1px solid var(--line2);padding:12px;border-radius:10px;margin-top:12px;font:12px/1.5 monospace}
.backup-tools button:disabled,.backup-tools input:disabled{opacity:.55;cursor:wait}@media(max-width:360px){.backup-card{padding:14px}.backup-table{font-size:12px}.backup-table th,.backup-table td{padding:9px 5px}}

/* A4 weekly coaching record. */
@media print{
  @page{size:A4;margin:13mm 14mm 14mm}
  html,body{background:#fff!important;color:#211a20!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{padding:0!important;margin:0!important;max-width:none!important}
  #printReport{padding:0!important;font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:10.5pt;line-height:1.35;color:#211a20;background:#fff}
  #printReport .print-day{break-before:page;break-inside:auto}
  #printReport .print-day:first-child{break-before:auto}
  #printReport .paper-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:0 0 4mm;border-bottom:2px solid #b34376;margin-bottom:4mm;break-inside:avoid}
  #printReport .paper-brand{display:block;font-size:17pt;letter-spacing:.13em;color:#9a285e;font-weight:700}
  #printReport .paper-purpose{display:block;font-size:9pt;color:#62545d;margin-top:1mm}
  #printReport .paper-meta{text-align:right;font-size:9pt;line-height:1.5;color:#62545d}
  #printReport .paper-day-title{margin:0 0 4mm;break-after:avoid}
  #printReport .paper-day-title>p{text-transform:uppercase;letter-spacing:.1em;font-size:8.5pt;color:#80546a;margin:0 0 1mm}
  #printReport .paper-day-title h1{font-size:23pt;line-height:1.1;font-weight:700;color:#211a20;margin:0}
  #printReport .paper-exercise{margin:0 0 2.5mm;break-inside:avoid}
  #printReport .paper-exercise-heading{break-after:avoid}
  #printReport .paper-exercise-heading h2{display:flex;gap:3mm;align-items:baseline;margin:0 0 1mm;font-size:12pt;line-height:1.25;font-weight:700;color:#211a20}
  #printReport .paper-exercise-heading h2>span{color:#9a285e;font-size:9.5pt;font-weight:600}
  #printReport .paper-exercise-heading>p{font-size:9pt;color:#62545d;margin:0 0 1.3mm}
  #printReport .paper-sets{width:100%;table-layout:fixed;border-collapse:collapse;margin:0 0 1mm;font-size:9pt;break-inside:avoid;font-variant-numeric:tabular-nums}
  #printReport .paper-sets th,#printReport .paper-sets td{padding:.8mm 2.4mm;border:0;border-bottom:1px solid #e6dce2;text-align:left;color:#211a20;vertical-align:top;overflow-wrap:anywhere}
  #printReport .paper-sets thead th{background:#f6eaf0;color:#79405b;font-size:8pt;text-transform:uppercase;letter-spacing:.04em;font-weight:600;border-top:1px solid #dac3cf;border-bottom:1px solid #dac3cf}
  #printReport .paper-sets th:first-child{width:12%}#printReport .paper-sets th:nth-child(2){width:16%}#printReport .paper-sets th:nth-child(3){width:58%}#printReport .paper-sets th:nth-child(4){width:14%}
  #printReport .paper-sets tbody th{font-weight:400}
  #printReport .paper-notes{display:flex;gap:3mm;align-items:flex-start;padding:0 1.5mm 1mm;break-inside:avoid}
  #printReport .paper-note{flex:0 1 86%;position:relative;border:1px solid #d6c5cf;border-radius:3mm;padding:2mm 3mm;max-width:86%;margin:1.5mm 0 2mm;break-inside:avoid;background:#fcf8fa}
  #printReport .paper-note.coach{margin-left:auto;background:#faedf3;border-color:#d6a5bb}
  #printReport .paper-note.athlete{margin-right:auto;background:#f5f4f6;border-color:#d8d4da}
  #printReport .paper-note:after{content:'';position:absolute;width:2mm;height:2mm;background:inherit;bottom:-1.2mm;transform:rotate(45deg);border-right:1px solid;border-bottom:1px solid;border-color:inherit}
  #printReport .paper-note.coach:after{right:4mm}#printReport .paper-note.athlete:after{left:4mm}
  #printReport .paper-note>strong{display:block;text-transform:uppercase;letter-spacing:.06em;font-size:7pt;color:#79536a;font-weight:600;margin:0 0 .5mm}
  #printReport .paper-note>p{font-size:9.5pt;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;orphans:3;widows:3;margin:0}
  #printReport .paper-footer{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #dacbd3;padding-top:3mm;margin-top:3mm;color:#796b74;font-size:8pt;break-inside:avoid}
  #printReport .paper-empty{padding:8mm 0;color:#796b74}

    <section class="workout-tools" aria-label="Training tools"><button class="tool-card" id="progressBtn"><span aria-hidden="true">↗</span><strong>Progress</strong><span>Exercise history and trends</span></button><button class="tool-card" id="exportBtn"><span aria-hidden="true">↓</span><strong>Export workouts</strong><span>Download a CSV record</span></button><button class="tool-card" id="printBtn"><span aria-hidden="true">▤</span><strong>Weekly summary</strong><span>Print your programme</span></button></section></div>`;
  document.getElementById('signout').onclick=()=>safeSignOut();

  document.getElementById('progressBtn').onclick=()=>renderProgress();
  document.getElementById('exportBtn').onclick=()=>exportWorkouts();

  document.getElementById('nextWorkout').onclick=()=>{const day=nextPlannedDay();if(day)openDay(day.id);};
  startClock();drawChatBadge();updateWeeklySummary();refreshRail();
  const waiting=new Set(PROGRAM.map(day=>day.id)),failures=new Map();
  const readStatus=()=>{
    const el=document.getElementById('workoutReadStatus');if(!el)return;
    el.textContent=waiting.size?'Loading saved workouts…':failures.size?'Some workouts could not be read. Use Reload saved workouts to retry.':'Saved workouts loaded for Week '+wk+'.';
    if(!waiting.size&&failures.size)setTxt('weekCompleted','—');

    const failed=error=>{
      if(token!==workoutViewToken||view.screen!=='home'||WEEK!==wk)return;

    };
    const u=onSnapshot(dref(wk,day.id),{includeMetadataChanges:true},snap=>{
      if(token!==workoutViewToken||view.screen!=='home'||WEEK!==wk)return;
      if(!snap.exists()&&snap.metadata?.fromCache&&navigator.onLine&&!state[key(wk,day.id)])return;
      waiting.delete(day.id);failures.delete(day.id);liveOn(!snap.metadata?.fromCache);
      if(!snap.exists()&&(navigator.onLine||!state[key(wk,day.id)])){

      const d=snap.exists()?acceptSession(wk,day.id,day,raw):raw;state[key(wk,day.id)]=d;

      updateWeeklySummary();refreshRail();readStatus();
    },failed);subs.push(u);
  });
}

function dayCardHTML(day,idx=0){

async function openDay(id){
  if(!trainingWeekReady)return;
  const token=++workoutViewToken,wk=WEEK,day=PROGRAM.find(d=>d.id===id);
  if(!day)return;
  view={screen:'session',dayId:id};clearSubs();clearGameTimers();renderedIds='';previousWorkout=null;setActiveNav('session');
  app.innerHTML='<div class="screen"><p class="loading-state" role="status">Loading session…</p></div>';
  try{await ensureDay(wk,id);}catch(error){
    if(token!==workoutViewToken)return;liveOn(false);workoutReadFailure(error,()=>openDay(id),'Could not load this workout');return;
  }
  if(token!==workoutViewToken||view.screen!=='session'||view.dayId!==id||WEEK!==wk)return;
  if(!navigator.onLine&&state[key(wk,id)]){renderSession(day);renderedIds=state[key(wk,id)].exercises.map(e=>e.id).join(',');}
  const u=onSnapshot(dref(wk,id),{includeMetadataChanges:true},snap=>{
    if(token!==workoutViewToken||view.screen!=='session'||view.dayId!==id||WEEK!==wk)return;
    liveOn(true);
    if(!snap.exists()&&(navigator.onLine||!state[key(wk,id)])){if(snap.metadata?.fromCache&&navigator.onLine)return;workoutReadFailure({code:'missing-session',message:'This saved session could not be found.'},()=>openDay(id),'Could not load this workout');return;}
    const raw=snap.exists()?snap.data():state[key(wk,id)];if(!Array.isArray(raw?.exercises)){workoutReadFailure({code:'unsupported-data',message:'Saved exercises have an invalid format.'},()=>openDay(id),'Could not load this workout');return;}
    const d=acceptSession(wk,id,day,raw);

  subs.push(u);
  if(wk>1){
    const cacheKey=key(wk-1,id);
    try{
      let previous=previousWorkoutCache.get(cacheKey);
      if(!previous){const prior=await getDoc(dref(wk-1,id));previous=prior.exists()?prior.data():{exercises:[]};previousWorkoutCache.set(cacheKey,previous);}
      if(token===workoutViewToken&&view.screen==='session'&&view.dayId===id&&WEEK===wk){previousWorkout=previous;updatePreviousComparisons(day);}
    }catch(e){if(token===workoutViewToken){app.querySelectorAll('.previous-session').forEach(el=>el.textContent='Previous session is unavailable.');}}
  }

function refreshSession(day){
  if(view.screen!=='session'||view.dayId!==day.id)return;

  d.exercises.forEach((e,i)=>{
    setIfBlur('en-'+i,e.name);setIfBlur('ld-'+i,e.load||'');setIfBlur('es-'+i,e.ts);setIfBlur('er-'+i,e.tr);setIfBlur('loadValue-'+i,Number.isFinite(e.loadValue)?e.loadValue:'');setIfBlur('loadUnit-'+i,e.loadUnit||'kg');setIfBlur('bandStrength-'+i,e.bandStrength||'');setIfBlur('eu-'+i,e.unit);
    setTxt('rl-'+i,isSec(e)?'Seconds':'Reps');setIfBlur('cn-'+i,e.cnote||'');setIfBlur('an-'+i,e.anote||'');

function setIfBlur(id,val){const el=document.getElementById(id);if(el&&document.activeElement!==el&&el.value!==(val+''))el.value=val;}

function closeExerciseNoteBubble(id,restoreFocus=false){

function positionExerciseNoteBubble(button,panel){

function updateExerciseLoad(e,field,raw){

let chatRendered=0,chatMessages=new Map(),chatCursor=null,chatHasMore=true,chatLoadingOlder=false,chatDrafts=new Map(),chatSending=false;
function activeChatDraft(){return chatDrafts.get(sessionOwner)||{text:'',id:''};}
function saveChatDraft(draft){
  if(!sessionOwner)return;chatDrafts.set(sessionOwner,draft);

function chatFeedback(text,retry=false){

async function sendChatDraft(){
  if(chatSending||!auth.currentUser||view.screen!=='chat')return;
  const input=document.getElementById('chatin');if(!input)return;
  const text=input.value.trim();if(!text)return;

  let draft=activeChatDraft();
  if(draft.text!==text||!draft.id)draft={text,id:uid(),t:Date.now()};
  saveChatDraft(draft);
  if(!navigator.onLine){chatFeedback('Message queued on this device. Send when connected.',true);return;}
  const owner=sessionOwner,epoch=accountEpoch,email=auth.currentUser.email||'';
  chatSending=true;chatFeedback('Sending…');
  try{
    await setDoc(doc(db,'messages',draft.id),{e:email,txt:draft.text,t:draft.t});
    if(epoch!==accountEpoch||owner!==sessionOwner)return;
    const current=document.getElementById('chatin');if(current&&current.value.trim()===draft.text)current.value='';
    const remaining=current?current.value:'';saveChatDraft({text:remaining,id:''});sound('pop');chatFeedback('Sent');
  }catch(e){if(epoch===accountEpoch)chatFeedback('Message could not be sent. Your draft is kept.',true);}
  finally{if(epoch===accountEpoch){chatSending=false;const send=document.getElementById('chatsend');if(send)send.disabled=false;}}
}

  view={screen:'chat',dayId:null};clearSubs();clearGameTimers();chatRendered=0;chatMessages=new Map();chatCursor=null;chatHasMore=true;chatLoadingOlder=false;

async function loadOlderChat(){

  const epoch=accountEpoch,button=document.getElementById('chatOlder');chatLoadingOlder=true;if(button){button.disabled=true;button.textContent='Loading…';}

    const docs=[];snap.forEach(d=>docs.push(d));docs.forEach(d=>chatMessages.set(d.id,{...d.data(),id:d.id}));
    if(docs.length)chatCursor=docs[docs.length-1];chatHasMore=docs.length===50;

    if(wrap)wrap.scrollTop=oldTop+(wrap.scrollHeight-oldHeight);
  }catch(e){if(epoch===accountEpoch)chatFeedback('Older messages could not load. Try again.');}

function drawChatMessages(me){

function appendChat(msgs,me){
  const wrap=document.getElementById('chatwrap');if(!wrap)return;

  if(!msgs.length){wrap.innerHTML='<p class="lb-empty" id="chatempty">No messages yet. Say hello.</p>';return;}
  const frag=document.createDocumentFragment(),seen=new Set();
  for(let i=0;i<msgs.length;i++){
    const m=msgs[i],id=m.id||String(m.t)+'-'+m.e+'-'+i;if(seen.has(id))continue;seen.add(id);
    const mine=m.e===me,who=(m.e||'').split('@')[0],el=document.createElement('div');el.className='msg '+(mine?'me':'them');el.dataset.id=id;
    const time=new Date(m.t||Date.now()).toLocaleTimeString(appPrefs.locale||'en-GB',{hour:'2-digit',minute:'2-digit'});

  }
  wrap.replaceChildren(frag);chatRendered=seen.size;if(atBottom)wrap.scrollTop=wrap.scrollHeight;
}

function buildRoutine(d){

const SND={ctx:null,muted:false};

function tone(f0,f1,dur,type,vol,when){ const c=SND.ctx; if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine';
  const t=c.currentTime+(when||0);
  o.frequency.setValueAtTime(f0,t); if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,fStart,fEnd){ const c=SND.ctx; if(!c)return;
  const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource();src.buffer=buf;
  const f=c.createBiquadFilter();f.type='lowpass';const t=c.currentTime;
  f.frequency.setValueAtTime(fStart||3200,t); f.frequency.exponentialRampToValueAtTime(fEnd||420,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+0.03);

let measurementUnsubscribe=null,measurementEpoch=0,measurementSequence=0,measurementLoaded=false;
let measurementReadError='',measurementLocalError='',measurementQueueDurable=false,measurementRecoveryBlocked=false;
let measurementImported=new Set(),measurementLegacyIds=new Set();
const measurementQueueVault=new Map();
function measurementCloudRef(id){return doc(db,'measurements',id);}
function measurementPendingKey(owner=measurementAccount){return 'pelooty.measurements.pending.v2.'+encodeURIComponent(owner);}
function measurementImportedKey(owner=measurementAccount){return 'pelooty.measurements.imported.v1.'+encodeURIComponent(owner);}
function measurementPreferenceKey(owner=measurementAccount){return 'pelooty.measurements.units.'+encodeURIComponent(owner);}
function measurementValidId(id){return typeof id==='string'&&id.length>0&&id.length<=1200&&!id.includes('/')&&id!=='.'&&id!=='..';}
function measurementCloudRecord(id,data){
  if(!measurementValidId(id)||!data||(data.schemaVersion!=null&&data.schemaVersion!==1))throw new Error('A saved measurement has an unsupported format.');
  return {...measurementReadRecord({...data,id}),deleted:data.deleted===true};
}
function measurementReadPatch(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid pending measurement change');
  const patch={};
  if(Object.hasOwn(raw,'date')){if(!measurementValidDate(raw.date))throw Error('Invalid pending date');patch.date=raw.date;}
  if(Object.hasOwn(raw,'notes')){if(typeof raw.notes!=='string'||raw.notes.length>2000)throw Error('Invalid pending notes');patch.notes=raw.notes;}
  if(Object.hasOwn(raw,'deleted')){if(typeof raw.deleted!=='boolean')throw Error('Invalid pending deletion');patch.deleted=raw.deleted;}
  if(Object.hasOwn(raw,'values')){
    if(!raw.values||typeof raw.values!=='object'||Array.isArray(raw.values))throw Error('Invalid pending values');
    patch.values={};
    for(const field of MEASURE_FIELDS)if(Object.hasOwn(raw.values,field.key)){
      const value=raw.values[field.key];
      if(value!==null&&(typeof value!=='number'||!Number.isFinite(value)||value<=0||value>100000))throw Error('Invalid pending measurement');
      patch.values[field.key]=value;
    }
  }
  return patch;
}
function measurementIntent(entry,base,prior){
  const patch=measurementReadPatch(prior?.patch||{}),values={...(patch.values||{})};
  for(const field of ['date','notes'])if(!base||entry[field]!==base[field]||Object.hasOwn(patch,field))patch[field]=entry[field];
  for(const field of MEASURE_FIELDS){
    const next=entry.values[field.key]??null,old=base?.values?.[field.key]??null;
    if(!base||next!==old||Object.hasOwn(values,field.key))values[field.key]=next;
  }
  if(Object.keys(values).length)patch.values=values;
  return patch;
}
function measurementApplyItem(remote,item){
  if(item.createOnly)return remote?cloneData(remote):{...cloneData(item.entry),deleted:item.deleted===true};
  const next=cloneData(remote||item.createEntry||item.entry);next.values={...(next.values||{})};
  const patch=measurementReadPatch(item.patch||{});
  for(const field of ['date','notes','deleted'])if(Object.hasOwn(patch,field))next[field]=patch[field];
  for(const [key,value]of Object.entries(patch.values||{})){if(value===null)delete next.values[key];else next.values[key]=value;}
  next.id=item.entry.id;next.updated=item.entry.updated;
  if(next.deleted==null)next.deleted=false;
  return next;
}
function measurementPersistQueue(){
  if(!measurementAccount)return;
  measurementQueueDurable=false;
  try{
    if(measurementRecoveryBlocked)throw Error('A recovery copy must be preserved first');
    if(Object.keys(measurementPending).length)localStorage.setItem(measurementPendingKey(),JSON.stringify({version:2,pending:measurementPending}));
    else localStorage.removeItem(measurementPendingKey());
    measurementQueueDurable=true;
  }catch{}
  measurementQueueVault.set(measurementAccount,{pending:cloneData(measurementPending),durable:measurementQueueDurable,protected:measurementRecoveryBlocked});
}
function measurementSavePreference(){try{localStorage.setItem(measurementPreferenceKey(),measurementUnit);}catch{}}
function measurementErrorMessage(error,action){
  const code=error?.code||'unavailable';
  if(code==='permission-denied')return 'Firebase access was denied for this account. Retry after access is restored. Pending measurements are retained.';
  return 'Firebase could not '+action+' measurements. Check your connection and retry. Pending measurements are retained.';
}
function measurementStatusUpdate(){
  const pending=Object.values(measurementPending),busy=measurementBusy.size>0;
  measurementStatus=measurementReadError?'Could not load from Firebase':pending.length?(busy?'Saving to Firebase…':!navigator.onLine?'Waiting for connection':pending.some(p=>p.error)?'Sync failed':'Waiting to sync'):measurementLoaded?(navigator.onLine?'Saved in Firebase':'Offline (showing loaded measurements)'):'Loading from Firebase…';
  measurementStorageError=[measurementReadError,measurementLocalError,pending.some(p=>p.error)?measurementErrorMessage({code:pending.find(p=>p.error).error},'save'):'',pending.length&&!measurementQueueDurable?'Keep this page open until syncing finishes (browser storage is unavailable).':''].filter(Boolean).join(' ');
  if(typeof measurementDrawStatus==='function')measurementDrawStatus();
}
function measurementBuildView(){
  const records=new Map(measurementRemote);
  for(const [id,item]of Object.entries(measurementPending)){
    if(item.createOnly&&records.has(id))continue;
    records.set(id,measurementApplyItem(records.get(id),item));
  }
  measurementEntries=measurementSort([...records.values()].filter(e=>!e.deleted));
  measurementTrash=measurementSort([...records.values()].filter(e=>e.deleted));
  measurementStatusUpdate();
  if(typeof measurementUpdatePanels==='function')measurementUpdatePanels();
}
function measurementLoadLegacy(owner){
  try{
    const raw=localStorage.getItem(measurementStorageKey(owner));
    let parsed=null;if(raw){parsed=JSON.parse(raw);if(parsed.version!==1||!Array.isArray(parsed.entries))throw Error('Unsupported browser log');}
    const savedUnit=localStorage.getItem(measurementPreferenceKey());measurementUnit=savedUnit==='imperial'||!savedUnit&&parsed?.unit==='imperial'?'imperial':'metric';
    const imported=JSON.parse(localStorage.getItem(measurementImportedKey())||'[]');
    if(Array.isArray(imported))measurementImported=new Set(imported.filter(measurementValidId));
    if(!parsed)return;
    const records=parsed.entries.map(e=>({entry:measurementReadRecord(e),deleted:false})).concat((Array.isArray(parsed.trash)?parsed.trash:[]).map(e=>({entry:measurementReadRecord(e),deleted:true})));
    for(const item of records){
      const id='legacy-'+encodeURIComponent(owner)+'-'+encodeURIComponent(item.entry.id);
      if(!measurementValidId(id))throw Error('Invalid browser entry ID');
      measurementLegacyIds.add(id);
      if(!measurementImported.has(id)&&!measurementPending[id])measurementPending[id]={entry:{...item.entry,id},deleted:item.deleted,createOnly:true,seq:++measurementSequence,error:''};
    }
  }catch{measurementLocalError='The earlier browser log could not be imported. Its recovery copy has been kept.';}
}
function measurementListen(){
  if(measurementUnsubscribe)measurementUnsubscribe();measurementUnsubscribe=null;
  const owner=measurementAccount,epoch=measurementEpoch;
  if(!owner||owner!==measurementOwner())return;
  measurementUnsubscribe=onSnapshot(collection(db,'measurements'),{includeMetadataChanges:true},snapshot=>{
    if(epoch!==measurementEpoch||owner!==measurementOwner()||owner!==measurementAccount)return;
    try{
      const remote=new Map();snapshot.forEach(d=>remote.set(d.id,measurementCloudRecord(d.id,d.data())));
      measurementRemote=remote;measurementReadError='';
      if(!snapshot.metadata?.fromCache)measurementLoaded=true;
      measurementBuildView();
      if(measurementLoaded&&navigator.onLine)measurementFlush();
    }catch(error){measurementReadError='A Firebase measurement could not be read. Retry loading the log.';measurementStatusUpdate();}
  },error=>{
    if(epoch!==measurementEpoch||owner!==measurementOwner()||owner!==measurementAccount)return;
    measurementReadError=measurementErrorMessage(error,'load');measurementLoaded=false;measurementStatusUpdate();
  });
}
function measurementLoad(){
  const owner=measurementOwner();
  if(measurementInitialised&&measurementAccount===owner)return;
  measurementStop();measurementAccount=owner;measurementInitialised=true;
  if(!owner)return;
  const vaulted=measurementQueueVault.get(owner);measurementRecoveryBlocked=!!vaulted?.protected;
  let pendingRaw=null;
  try{
    pendingRaw=localStorage.getItem(measurementPendingKey(owner));
    const saved=vaulted?.pending||JSON.parse(pendingRaw||'null')?.pending||{};
    for(const [id,item]of Object.entries(saved)){
      if(!measurementValidId(id)||!item?.entry)continue;
      const entry=measurementReadRecord({...item.entry,id});
      const patch=item.patch?measurementReadPatch(item.patch):measurementIntent(entry,null,null);
      if(!item.patch)patch.deleted=item.deleted===true;
      measurementPending[id]={entry,deleted:item.deleted===true,createOnly:item.createOnly===true,patch,createEntry:item.createEntry?measurementReadRecord({...item.createEntry,id}):null,seq:++measurementSequence,error:''};
    }
    if(measurementRecoveryBlocked)throw Error('A pending recovery copy needs preserving');
  }catch{
    if(pendingRaw){
      measurementRecoveryBlocked=true;
      try{localStorage.setItem(measurementPendingKey(owner)+'.recovery.'+uid(),pendingRaw);measurementRecoveryBlocked=false;}catch{}
    }
    measurementLocalError='Pending browser changes could not be read. The saved recovery copy has been kept.';
  }
  measurementLoadLegacy(owner);measurementPersistQueue();measurementBuildView();measurementListen();
}
function measurementSaveEntry(entry,deleted=false,base=null){
  if(!measurementAccount||measurementAccount!==measurementOwner()||!measurementLoaded||measurementReadError){measurementFormError('Connect to Firebase and load the shared log before saving.');return false;}
  const clean=measurementReadRecord(entry);if(!measurementValidId(clean.id))throw Error('Invalid measurement ID');
  const prior=measurementPending[clean.id],remote=measurementRemote.get(clean.id);
  const current=prior?measurementApplyItem(remote,prior):remote;
  const toggleOnly=deleted===true||entry.deleted===true||!base&&current?.deleted===true;
  const baseline=base?measurementReadRecord(base):current?measurementReadRecord(current):null;
  let patch;
  if(toggleOnly){patch={...measurementReadPatch(prior?.patch||{}),deleted:deleted===true};clean.updated=Date.now();}
  else patch=!baseline&&!prior?{}:measurementIntent(clean,baseline,prior);
  const createEntry=prior?.createEntry||(!remote?(prior?.entry||clean):null);
  measurementPending[clean.id]={entry:clean,deleted:deleted===true,createOnly:false,patch,createEntry:createEntry?measurementReadRecord(createEntry):null,seq:++measurementSequence,error:''};
  measurementPersistQueue();measurementBuildView();return measurementFlush();
}
async function measurementFlush(){
  const owner=measurementAccount,epoch=measurementEpoch;
  if(!owner||owner!==measurementOwner()||!measurementLoaded||!navigator.onLine){measurementStatusUpdate();return false;}
  const tasks=Object.keys(measurementPending).map(id=>{
    if(measurementBusy.has(id))return measurementBusy.get(id);
    const task=(async()=>{
      while(measurementPending[id]&&epoch===measurementEpoch&&owner===measurementOwner()){
        const item=cloneData(measurementPending[id]);
        if(item.error)break;
        try{
          const result=await runTransaction(db,async tx=>{
            if(epoch!==measurementEpoch||owner!==measurementOwner())throw Error('Account changed');
            const ref=measurementCloudRef(id),snap=await tx.get(ref);
            if(epoch!==measurementEpoch||owner!==measurementOwner())throw Error('Account changed');
            if(item.createOnly&&snap.exists())return measurementCloudRecord(id,snap.data());
            const data={...measurementApplyItem(snap.exists()?snap.data():null,item),id,schemaVersion:1,updatedBy:owner};
            tx.set(ref,data);return measurementCloudRecord(id,data);
          });
          if(epoch!==measurementEpoch||owner!==measurementOwner())return;
          measurementRemote.set(id,result);
          if(measurementPending[id]?.seq===item.seq)delete measurementPending[id];
          else if(measurementPending[id]){
            const newer=measurementPending[id],remaining=measurementReadPatch(newer.patch||{}),acknowledged=measurementReadPatch(item.patch||{});
            for(const field of ['date','notes','deleted'])if(Object.hasOwn(acknowledged,field)&&remaining[field]===acknowledged[field])delete remaining[field];
            for(const [field,value]of Object.entries(acknowledged.values||{}))if(remaining.values&&Object.hasOwn(remaining.values,field)&&remaining.values[field]===value)delete remaining.values[field];
            if(remaining.values&&!Object.keys(remaining.values).length)delete remaining.values;
            newer.patch=remaining;newer.createEntry=null;
            if(!Object.keys(remaining).length)delete measurementPending[id];
          }
          if(measurementLegacyIds.has(id)){
            measurementImported.add(id);try{localStorage.setItem(measurementImportedKey(),JSON.stringify([...measurementImported]));}catch{}
          }
          measurementPersistQueue();measurementBuildView();
        }catch(error){
          if(epoch!==measurementEpoch||owner!==measurementOwner())return;
          if(measurementPending[id])measurementPending[id].error=error?.code||'unavailable';
          measurementPersistQueue();measurementStatusUpdate();break;
        }
      }
    })();
    measurementBusy.set(id,task);measurementStatusUpdate();
    return task.finally(()=>{if(epoch===measurementEpoch){measurementBusy.delete(id);measurementStatusUpdate();}});
  });
  await Promise.all(tasks);return epoch===measurementEpoch&&Object.keys(measurementPending).length===0;
}
function measurementRetry(){
  if(!measurementAccount||measurementAccount!==measurementOwner())return;
  for(const item of Object.values(measurementPending))item.error='';
  measurementReadError='';measurementListen();return measurementFlush();
}
function measurementHasVolatilePending(){
  if(Object.keys(measurementPending).length&&!measurementQueueDurable)return true;
  return [...measurementQueueVault.values()].some(v=>!v.durable&&Object.keys(v.pending).length);
}
function measurementStop(){
  measurementPersistQueue();measurementEpoch++;
  if(measurementUnsubscribe)measurementUnsubscribe();measurementUnsubscribe=null;
  measurementRemote=new Map();measurementPending={};measurementBusy=new Map();measurementLoaded=false;
  measurementImported=new Set();measurementLegacyIds=new Set();measurementReadError='';measurementLocalError='';measurementQueueDurable=false;measurementRecoveryBlocked=false;
  measurementAccount='';measurementEntries=[];measurementEditing=null;measurementDraft=null;measurementEditBase=null;
  measurementDeleted=null;measurementTrash=[];measurementStorageError='';measurementStatus='';measurementUnit='metric';

window.addEventListener('online',()=>{if(measurementAccount)measurementRetry();});
window.addEventListener('offline',()=>measurementStatusUpdate());

function measurementCaptureForm(){
  const form=document.getElementById('measurement-form');if(!form)return {ok:false};
  const date=form.elements.namedItem('date').value,notes=form.elements.namedItem('notes').value.trim();
  if(!measurementValidDate(date)||date>ymd(new Date()))return {ok:false,message:'Choose a valid date up to today.'};
  const values={};
  for(const f of MEASURE_FIELDS){
    const input=form.elements.namedItem(f.key);const raw=input.value.trim();
    if(!raw)continue;
    const n=Number(raw);
    if(!Number.isFinite(n)||n<=0||n>100000)return {ok:false,message:'Enter a positive number for '+f.label.toLowerCase()+'.',field:f.key};
    const originalCanonical=Number(input.dataset?.canonical);
    const unchanged=input.dataset?.originalDisplay!=null&&Number(input.dataset.originalDisplay)===n&&Number.isFinite(originalCanonical)&&originalCanonical>0;
    const canonical=unchanged?originalCanonical:measurementToCanonical(n,f);
    if(canonical>100000)return {ok:false,message:'The '+f.label.toLowerCase()+' value is too large.',field:f.key};
    values[f.key]=canonical;
  }
  return {ok:true,date,notes:notes.slice(0,2000),values};
}
function measurementFormError(message,field){

function measurementBuildDifferences(){
  measurementDifferences=new Map();const previous={};
  for(const entry of measurementSort(measurementEntries).reverse()){
    for(const field of MEASURE_FIELDS){
      if(entry.values[field.key]==null)continue;
      const prior=previous[field.key];
      if(prior){
        const delta=measurementFromCanonical(entry.values[field.key]-prior.values[field.key],field);
        measurementDifferences.set(entry.id+':'+field.key,(delta>0?'+':'')+measurementNumber(delta)+' '+measurementUnits(field)+' since '+measurementDate(prior.date));
      }
      previous[field.key]=entry;
    }
  }
}
function measurementDifference(entry,field){return measurementDifferences.get(entry.id+':'+field.key)||'';}

function measurementChart(rows,title,id){
  if(!rows.length)return '';
  const width=560,height=220,left=56,right=20,top=24,bottom=42;
  const values=rows.map(r=>r.value),lo=Math.min(...values),hi=Math.max(...values),padding=Math.max((hi-lo)*.15,Math.abs(hi)*.01,.1),min=Math.max(0,lo-padding),max=hi+padding;

/* Shared-data JSON backups. Restore adds missing records and preserves saved records. */
const PELOOTY_BACKUP_FORMAT='pelooty-backup',PELOOTY_BACKUP_VERSION=1,BACKUP_MAX_BYTES=10*1024*1024;
let backupRequest=0,backupPreview=null,backupPreviewOwner='',backupBusy=false,backupRegisteredOwner='',backupOperation=0;
function backupOwner(){return auth.currentUser?.uid||'';}
function backupToken(){return {owner:backupOwner(),epoch:typeof accountEpoch==='number'?accountEpoch:0};}
function backupAssertAccount(token){if(!token.owner||backupOwner()!==token.owner||(typeof accountEpoch==='number'&&accountEpoch!==token.epoch))throw Object.assign(Error('The account changed. Open backup tools again.'),{code:'account-changed'});}

function backupSafeId(id){return typeof id==='string'&&id.length>0&&new TextEncoder().encode(id).length<=1500&&!id.includes('/')&&id!=='.'&&id!=='..';}
function backupFail(message){throw Object.assign(Error(message),{code:'invalid-backup'});}
function backupJSONValue(value,depth=0){
  if(depth>24)backupFail('The backup contains data nested too deeply.');
  if(value===null||typeof value==='boolean'||typeof value==='string')return;
  if(typeof value==='number'){if(!Number.isFinite(value))backupFail('The backup contains an invalid number.');return;}
  if(Array.isArray(value)){for(const item of value)backupJSONValue(item,depth+1);return;}
  if(!backupPlain(value))backupFail('The backup contains an unsupported value.');
  for(const [key,item]of Object.entries(value)){
    if(['__proto__','prototype','constructor'].includes(key))backupFail('The backup contains an unsupported field name.');
    backupJSONValue(item,depth+1);
  }

  if(!/^w[1-9]\d{0,5}-d[1-6]$/.test(id)||!backupPlain(data)||!Array.isArray(data.exercises)||data.exercises.length>500)backupFail('A workout record has an invalid format.');
  for(const exercise of data.exercises){
    if(!backupPlain(exercise)||typeof exercise.name!=='string'||exercise.name.length>1000||!Array.isArray(exercise.sets)||exercise.sets.length>500)backupFail('A workout exercise has an invalid format.');
    if(exercise.id!=null&&(typeof exercise.id!=='string'||exercise.id.length>1200))backupFail('A workout exercise has an invalid ID.');
    for(const key of ['ts','tr'])if(exercise[key]!=null&&(typeof exercise[key]!=='number'||!Number.isFinite(exercise[key])||exercise[key]<0))backupFail('A workout target has an invalid format.');
    for(const set of exercise.sets){const value=backupPlain(set)?set.value:set;if(typeof value!=='number'||!Number.isFinite(value)||value<0)backupFail('A recorded set has an invalid value.');}
  }

}
function backupValidateCalendar(data){
  if(!backupPlain(data)||!backupPlain(data.days))backupFail('The calendar has an invalid format.');
  for(const [date,mark]of Object.entries(data.days)){
    if(!measurementValidDate(date)||!backupPlain(mark)||(mark.done!=null&&typeof mark.done!=='boolean')||(mark.dayId!=null&&(!Number.isInteger(mark.dayId)||mark.dayId<0||mark.dayId>6)))backupFail('A calendar date has an invalid format.');

function backupValidate(input){

  const data=input.data;
  if(!Array.isArray(data.sessions)||!Array.isArray(data.measurements)||data.sessions.length>20000||data.measurements.length>20000)backupFail('The backup has an invalid record list.');
  const validateList=(rows,validate)=>{const ids=new Set();for(const row of rows){if(!backupPlain(row)||!backupSafeId(row.id)||ids.has(row.id)||!backupPlain(row.data))backupFail('The backup contains an invalid or repeated record ID.');ids.add(row.id);if(new TextEncoder().encode(JSON.stringify(row.data)).length>1000000)backupFail('A backup record is too large to restore safely.');validate(row.id,row.data);}};
  validateList(data.sessions,backupValidateSession);validateList(data.measurements,backupValidateMeasurements);
  if(data.calendar!=null){if(data.calendar.id!=='marks')backupFail('The calendar record has an invalid ID.');backupValidateCalendar(data.calendar.data);}
  if(data.meta!=null){if(data.meta.id!=='app'||!backupPlain(data.meta.data)||!Number.isSafeInteger(data.meta.data.week)||data.meta.data.week<1)backupFail('The training-week record has an invalid format.');}
  const preferences=data.preferences;
  if(preferences!=null){if(!backupPlain(preferences)||(preferences.locale!=null&&!['en-GB','en-US','de-DE','fr-FR'].includes(preferences.locale))||(preferences.reduceMotion!=null&&typeof preferences.reduceMotion!=='boolean')||(preferences.trustedDevice!=null&&typeof preferences.trustedDevice!=='boolean'))backupFail('The saved preferences have an invalid format.');}
  return {format:input.format,version:input.version,exportedAt:input.exportedAt,data:JSON.parse(JSON.stringify({sessions:data.sessions,measurements:data.measurements,calendar:data.calendar||null,meta:data.meta||null,preferences:preferences||{}}))};
}
function backupParseJSON(text){
  if(typeof text!=='string'||new TextEncoder().encode(text).length>BACKUP_MAX_BYTES)backupFail('Choose a backup smaller than 10 MB.');
  let input;try{input=JSON.parse(text.replace(/^\uFEFF/,''));}catch{backupFail('The selected file is not valid JSON.');}

}
function backupSnapshotConfirmed(snapshot){if(snapshot.metadata?.fromCache)throw Object.assign(Error('Connect to Firebase to read the complete saved data.'),{code:'unavailable'});}
async function backupReadShared(token){
  const [sessions,measurements,calendar,meta]=await Promise.all([getDocs(collection(db,'sessions')),getDocs(collection(db,'measurements')),getDoc(doc(db,'calendar','marks')),getDoc(doc(db,'meta','app'))]);
  backupAssertAccount(token);for(const snapshot of [sessions,measurements,calendar,meta])backupSnapshotConfirmed(snapshot);
  const rows=snapshot=>{const result=[];snapshot.forEach(d=>result.push({id:d.id,data:d.data()}));return result;};
  return {sessions:rows(sessions),measurements:rows(measurements),calendar:calendar.exists()?{id:'marks',data:calendar.data()}:null,meta:meta.exists()?{id:'app',data:meta.data()}:null};
}
function backupHasPending(){
  return (typeof sessionPending!=='undefined'&&Object.values(sessionPending).some(item=>item.ops?.length))||(typeof measurementPending!=='undefined'&&Object.keys(measurementPending).length>0);
}
async function backupCreate(){
  const token=backupToken();backupAssertAccount(token);if(!navigator.onLine)throw Error('Connect to Firebase before downloading a complete backup.');
  if(typeof flushSaves==='function')await flushSaves();if(typeof measurementFlush==='function')await measurementFlush();backupAssertAccount(token);
  if(backupHasPending())throw Error('Some changes are waiting to sync. Retry syncing before downloading a complete backup.');
  const data=await backupReadShared(token);
  const preferences=typeof appPrefs==='undefined'?{}:{locale:appPrefs.locale,reduceMotion:!!appPrefs.reduceMotion,trustedDevice:!!appPrefs.trustedDevice};
  return backupValidate({format:PELOOTY_BACKUP_FORMAT,version:PELOOTY_BACKUP_VERSION,exportedAt:new Date().toISOString(),data:{...data,preferences}});
}
function addDownloadJSON(filename,value){
  const text=JSON.stringify(value,null,2);
  try{const url=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  catch{const host=document.getElementById('backup-download-fallback');if(host){host.hidden=false;host.textContent='Copy this JSON into a file named '+filename;const field=document.createElement('textarea');field.className='backup-json-fallback';field.readOnly=true;field.value=text;field.setAttribute('aria-label','Backup JSON');host.appendChild(field);field.focus();field.select();}}
  return text;

async function backupMakePlan(backup){
  const token=backupToken();backupAssertAccount(token);if(!navigator.onLine)throw Error('Connect to Firebase to preview the restore.');
  const current=await backupReadShared(token),sessionIds=new Set(current.sessions.map(r=>r.id)),measurementIds=new Set(current.measurements.map(r=>r.id));
  const summary=(rows,ids)=>({add:rows.filter(r=>!ids.has(r.id)).length,keep:rows.filter(r=>ids.has(r.id)).length});
  const dates=Object.keys(backup.data.calendar?.data.days||{}),savedDays=current.calendar?.data.days||{};
  if(current.calendar&&!backupPlain(savedDays))throw Error('The saved calendar could not be read. Restore preview stopped.');
  return {sessions:summary(backup.data.sessions,sessionIds),measurements:summary(backup.data.measurements,measurementIds),calendar:{add:dates.filter(d=>!Object.prototype.hasOwnProperty.call(savedDays,d)).length,keep:dates.filter(d=>Object.prototype.hasOwnProperty.call(savedDays,d)).length},meta:{add:backup.data.meta&&!current.meta?1:0,keep:backup.data.meta&&current.meta?1:0}};
}
function backupResult(){return {sessions:{added:0,skipped:0,failed:0},measurements:{added:0,skipped:0,failed:0},calendar:{added:0,skipped:0,failed:0},meta:{added:0,skipped:0,failed:0},errors:[],preferences:false};}
async function backupRestore(backup,options={}){
  backup=backupValidate(backup);const token=backupToken();backupAssertAccount(token);if(!navigator.onLine)throw Error('Connect to Firebase before restoring.');
  const result=backupResult(),progress=()=>{if(typeof options.onProgress==='function')options.onProgress(result);};
  const add=async(kind,id,data)=>{
    try{
      const created=await runTransaction(db,async tx=>{backupAssertAccount(token);const ref=doc(db,kind,id),snapshot=await tx.get(ref);backupAssertAccount(token);if(snapshot.exists())return false;tx.set(ref,data);return true;});
      result[kind][created?'added':'skipped']++;
    }catch(error){if(error?.code==='account-changed')throw error;result[kind].failed++;result.errors.push({kind,code:String(error?.code||'write-failed').slice(0,80)});}progress();
  };
  for(const row of backup.data.sessions){backupAssertAccount(token);await add('sessions',row.id,row.data);}
  for(const row of backup.data.measurements){backupAssertAccount(token);await add('measurements',row.id,row.data);}
  if(backup.data.calendar){
    const dates=Object.keys(backup.data.calendar.data.days);
    try{
      const counts=await runTransaction(db,async tx=>{
        backupAssertAccount(token);const ref=doc(db,'calendar','marks'),snapshot=await tx.get(ref);backupAssertAccount(token);
        if(!snapshot.exists()){tx.set(ref,backup.data.calendar.data);return {added:dates.length,skipped:0};}
        const current=snapshot.data();if(!backupPlain(current.days||{}))throw Error('Invalid saved calendar');
        const additions={};for(const date of dates)if(!Object.prototype.hasOwnProperty.call(current.days||{},date))additions[date]=backup.data.calendar.data.days[date];
        const count=Object.keys(additions).length;if(count)tx.set(ref,{days:additions},{merge:true});return {added:count,skipped:dates.length-count};
      });Object.assign(result.calendar,counts);
    }catch(error){if(error?.code==='account-changed')throw error;result.calendar.failed=dates.length||1;result.errors.push({kind:'calendar',code:String(error?.code||'write-failed').slice(0,80)});}progress();
  }
  if(backup.data.meta)await add('meta','app',backup.data.meta.data);
  backupAssertAccount(token);
  if(options.applyPreferences&&typeof appPrefs!=='undefined'){
    if(backup.data.preferences.locale)appPrefs.locale=backup.data.preferences.locale;
    if(typeof backup.data.preferences.reduceMotion==='boolean')appPrefs.reduceMotion=backup.data.preferences.reduceMotion;
    result.preferences=typeof saveAppPrefs==='function'?saveAppPrefs():false;if(typeof applyAppPrefs==='function')applyAppPrefs();
  }
  if(typeof progressCache!=='undefined')progressCache=null;
  progress();return result;
}
function backupDispose(){backupRequest++;backupOperation++;backupPreview=null;backupPreviewOwner='';backupBusy=false;backupRegisteredOwner='';}
function backupUIStatus(message,error=false){const el=document.getElementById('backup-status');if(el){el.textContent=message;el.classList.toggle('backup-error',error);}}
function backupCountsHTML(plan){return '<table class="backup-table"><caption>Restore preview</caption><thead><tr><th scope="col">Data</th><th scope="col">Add missing</th><th scope="col">Already saved</th></tr></thead><tbody>'+[['Workouts',plan.sessions],['Measurements',plan.measurements],['Calendar dates',plan.calendar],['Training week',plan.meta]].map(([label,row])=>'<tr><th scope="row">'+label+'</th><td>'+row.add+'</td><td>'+row.keep+'</td></tr>').join('')+'</tbody></table>';}
function backupRestoreSummary(result){return [['workouts',result.sessions],['measurements',result.measurements],['calendar dates',result.calendar],['training-week records',result.meta]].map(([label,row])=>row.added+' '+label+' added, '+row.skipped+' kept'+(row.failed?', '+row.failed+' failed':'')).join(' · ');}
function backupSetBusy(busy){backupBusy=busy;for(const id of ['backup-back','backup-download','backup-file','backup-confirm']){const el=document.getElementById(id);if(el)el.disabled=busy;}const pref=document.getElementById('backup-restore-prefs');if(pref)pref.disabled=busy;}
function renderBackupTools(){
  if(!backupOwner())return signInScreen();
  const owner=backupOwner();if(backupPreviewOwner&&backupPreviewOwner!==owner)backupDispose();
  if(backupRegisteredOwner!==owner&&typeof addAccountDisposer==='function'){backupRegisteredOwner=owner;addAccountDisposer(backupDispose);}
  const request=++backupRequest;clearSubs();clearGameTimers();view={screen:'backup',dayId:null};setActiveNav('settings');
  app.innerHTML='<div class="screen backup-tools"><button class="back" id="backup-back">‹ Settings</button><div class="shead"><h2>Backup and restore</h2></div><section class="backup-card"><h3>Download a complete backup</h3><p>Save workouts, calendar entries, measurements (including recently deleted entries), the training week and your preferences in one JSON file.</p><button type="button" class="tool-button primary" id="backup-download">Download JSON backup</button><div id="backup-download-fallback" hidden></div></section><section class="backup-card"><h3>Restore saved data</h3><p>Choose a Pelooty JSON backup to preview its contents. Restore adds missing records and keeps existing records.</p><label class="backup-file-label" for="backup-file">Choose backup file (up to 10 MB)</label><input id="backup-file" type="file" accept=".json,application/json"><div id="backup-preview" aria-live="polite"></div></section><p id="backup-status" class="tool-status" role="status"></p></div>';
  document.getElementById('backup-back').onclick=renderSettings;
  const current=()=>request===backupRequest&&owner===backupOwner()&&view.screen==='backup';
  document.getElementById('backup-download').onclick=async()=>{
    const operation=++backupOperation;backupSetBusy(true);backupUIStatus('Reading saved data from Firebase…');
    try{const value=await backupCreate();if(!current())return;addDownloadJSON('pelooty-backup-'+new Date().toISOString().slice(0,10)+'.json',value);backupUIStatus('Backup ready: '+value.data.sessions.length+' workouts and '+value.data.measurements.length+' measurements.');}
    catch(error){if(current())backupUIStatus(error?.code==='invalid-backup'?'The saved data could not be packaged safely. '+error.message:'Backup could not be completed. '+(error.message||'Check the connection and retry.'),true);}
    finally{if(operation===backupOperation)backupSetBusy(false);}
  };
  document.getElementById('backup-file').onchange=async event=>{
    const file=event.target.files?.[0];if(!file)return;
    backupPreview=null;backupPreviewOwner=owner;document.getElementById('backup-preview').innerHTML='';
    if(file.size>BACKUP_MAX_BYTES){backupUIStatus('Choose a backup smaller than 10 MB.',true);return;}
    const operation=++backupOperation;backupSetBusy(true);backupUIStatus('Checking the backup and saved Firebase records…');
    try{
      const value=backupParseJSON(await file.text());if(!current())return;
      const plan=await backupMakePlan(value);if(!current())return;
      backupPreview=value;document.getElementById('backup-preview').innerHTML='<p class="tool-status">Backup created '+esc(new Date(value.exportedAt).toLocaleString(appPrefs.locale))+'</p>'+backupCountsHTML(plan)+'<label class="backup-preference"><input id="backup-restore-prefs" type="checkbox"> Restore appearance and language preferences</label><button type="button" class="tool-button primary" id="backup-confirm">Restore missing records</button>';
      document.getElementById('backup-confirm').onclick=async()=>{
        if(!backupPreview||backupBusy)return;
        const applyPreferences=!!document.getElementById('backup-restore-prefs').checked,operation=++backupOperation;backupSetBusy(true);backupUIStatus('Restoring missing records…');
        try{const result=await backupRestore(backupPreview,{applyPreferences,onProgress:progress=>{if(current())backupUIStatus(backupRestoreSummary(progress));}});if(!current())return;const failed=result.errors.length>0;backupUIStatus((failed?'Restore partially completed. Retry to add the remaining records. ':'Restore complete. ')+backupRestoreSummary(result),failed);document.getElementById('backup-confirm').textContent=failed?'Retry remaining records':'Check restore again';}
        catch(error){if(current())backupUIStatus(error?.code==='account-changed'?'The account changed. Open backup tools again.':'Restore stopped. '+(error.message||'Check the connection and retry.'),true);}
        finally{if(operation===backupOperation)backupSetBusy(false);}
      };
      backupUIStatus('Review the counts, then choose Restore missing records.');
    }catch(error){if(current())backupUIStatus(error?.code==='invalid-backup'?error.message:'The restore preview could not be completed. Check the connection and retry.',true);}
    finally{if(operation===backupOperation)backupSetBusy(false);}
  };
  backupSetBusy(backupBusy);
}

initialiseShell();
function esc(s){return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let trainingWeekReady=false,trainingLoadAttempt=0;
function validTrainingWeek(value){const n=Number(value);return Number.isSafeInteger(n)&&n>=1?n:null;}
function trainingWeekStorageKey(){return 'pelooty_training_week_'+encodeURIComponent(currentAccountKey());}
function rememberTrainingWeek(wk){try{localStorage.setItem(trainingWeekStorageKey(),String(wk));}catch{}}
function setWeek(w){
  if(!auth.currentUser||!trainingWeekReady)return;
  const next=validTrainingWeek(w);if(next==null)return;
  const epoch=accountEpoch;WEEK=next;rememberTrainingWeek(next);document.getElementById('wkNum').textContent=WEEK;
  setDoc(doc(db,'meta','app'),{week:next},{merge:true}).catch(error=>{if(epoch===accountEpoch)toolNotice('This week opened, but the shared training week could not be saved. '+(error?.code||'Please reconnect and retry.'),true);});
  if(view.screen==='session')openDay(view.dayId);else renderHome();
}
function workoutReadFailure(error,retry,title='Could not load workouts'){
  const code=String(error?.code||'read-failed');
  const message=code==='permission-denied'?'This account could not read the saved workout data. Check account access and retry.':code==='offline-uncached'?'Connect to load the current training week.':'The saved workout data could not be read. Check your connection and retry.';
  app.innerHTML='<div class="screen"><div class="center"><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p><button class="tool-button primary" id="workoutReadRetry">Retry loading</button><button class="back" id="workoutReadSignOut">Sign out</button><details style="margin-top:18px"><summary>Technical details</summary><p style="margin-top:12px">'+esc(code+': '+(error?.message||'The read failed.'))+'</p></details></div></div>';
  document.getElementById('workoutReadRetry').onclick=retry;
  document.getElementById('workoutReadSignOut').onclick=safeSignOut;
}
async function restoreTrainingWeek(epoch){
  const attempt=++trainingLoadAttempt;trainingWeekReady=false;
  for(const id of ['nav','settingsBtn']){const el=document.getElementById(id);if(el)el.hidden=true;}
  const controls=document.querySelector('.wk');if(controls)controls.hidden=true;
  view={screen:'loading-workouts',dayId:null};
  app.innerHTML='<div class="center"><h2>Loading your workouts…</h2><p role="status">Reading the saved training week.</p></div>';
  try{
    let wk;
    if(navigator.onLine){
      const metadata=await getDoc(doc(db,'meta','app'));
      if(epoch!==accountEpoch||attempt!==trainingLoadAttempt)return false;
      wk=metadata.exists()?validTrainingWeek(metadata.data().week):null;
      if(metadata.exists()&&wk==null)throw Object.assign(new Error('The saved current week has an invalid value.'),{code:'invalid-training-week'});
      if(wk==null)wk=20;
    }else{
      let remembered=null;try{remembered=validTrainingWeek(localStorage.getItem(trainingWeekStorageKey()));}catch{}
      const cached=Object.keys(state).map(k=>/^w(\d+)-d\d+$/.exec(k)).filter(Boolean).map(m=>+m[1]);
      wk=remembered|| (cached.length?Math.max(...cached):null);
      if(wk==null)throw Object.assign(new Error('No saved training week is available on this device.'),{code:'offline-uncached'});
    }

    if(epoch===accountEpoch&&attempt===trainingLoadAttempt)workoutReadFailure(error,()=>startAccountWorkouts(auth.currentUser,epoch));
