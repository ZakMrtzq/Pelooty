  }
}
async function startAccountWorkouts(user,epoch){
  if(!user||epoch!==accountEpoch)return;
  const ready=await restoreTrainingWeek(epoch);if(!ready||epoch!==accountEpoch)return;
  const live=document.getElementById('live');if(live)live.style.display='';
  if(typeof onSignedIn==='function')onSignedIn(user);
  startClock();startPresence();startChatWatch();startSplashWatch();renderHome();flushSaves();if(!reducedMotion())introSplash();
}
async function reloadSavedWorkouts(){
  if(!auth.currentUser)return;
  clearSubs();clearGameTimers();resetWorkoutView();
  await startAccountWorkouts(auth.currentUser,accountEpoch);
}
document.getElementById('wkUp').onclick=()=>setWeek(WEEK+1);
document.getElementById('wkDown').onclick=()=>setWeek(WEEK-1);

function handleErr(e){
  if(e&&e.code==="permission-denied"){clearSubs();
    app.innerHTML='<div class="center"><h2>No access</h2><p>This account isn\u2019t on the allow-list. Ask the coach to add your email to the Firestore rules.</p><button class="gbtn" id="so2">Use a different account</button></div>';
    const b=document.getElementById('so2');if(b)b.onclick=safeSignOut;}
}
const isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
function doSignIn(){
  if(isMobile){ signInWithRedirect(auth,provider); return; }
  signInWithPopup(auth,provider).catch(e=>{
    const c=e&&e.code||'';
    if(c.indexOf('popup')>=0||c==='auth/operation-not-supported-in-this-environment'||c==='auth/cancelled-popup-request'){ signInWithRedirect(auth,provider); }
    else alert(e.message||e);
  });
}
getRedirectResult(auth).catch(e=>{ console.warn('redirect',e); if(e&&e.code==='auth/unauthorized-domain'){ alert('This site\u2019s web address isn\u2019t authorised in Firebase yet. Add it under Authentication \u2192 Settings \u2192 Authorized domains.'); } });
function signInScreen(){
  for(const id of ['nav','rail']){const el=document.getElementById(id);if(el)el.hidden=true;}
  const live=document.getElementById('live');if(live)live.style.display='none';
  const week=document.querySelector('.wk');if(week)week.hidden=true;
  app.innerHTML='<div class="center"><h2>Pelooty 🍑</h2><p>Private coaching log. Sign in to continue.</p><button class="gbtn" id="gin"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.46 14.97.5 12 .5A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 4.75 12 4.75z"/></svg>Sign in with Google</button></div>';
  document.getElementById('gin').onclick=doSignIn;

function disposeAccount(){
  persistSessionQueue();if(typeof measurementStop==='function')measurementStop();accountEpoch++;trainingWeekReady=false;trainingLoadAttempt++;

  presenceStarted=false;presenceData={};presenceErr='';clockStarted=false;clearInterval(clockInterval);clockInterval=null;
  chatWatchStarted=false;allChat=[];lastReadChat=0;lastReadWrite=0;unreadChat=0;chatMaxSeen=0;chatRendered=0;chatMessages=new Map();chatCursor=null;chatSending=false;
  splashSeenT=0;splashCoolUntil=0;splashCounts={};splashWatchStarted=false;introShown=false;

async function safeSignOut(){
  await flushSaves();
  if(typeof measurementFlush==='function')await measurementFlush();
  if(typeof measurementHasVolatilePending==='function'&&measurementHasVolatilePending()){toolNotice('Measurements are waiting to sync. Keep this page open, reconnect and retry before signing out.',true);return;}
  if(!sessionQueueDurable&&Object.values(sessionPending).some(x=>x.ops?.length)){
    if(typeof toolNotice==='function')toolNotice(trustedDevice()?'Your changes are queued, and browser storage is unavailable. Keep this tab open and reconnect before signing out.':'Your changes are still queued in this tab. Reconnect and retry before signing out, or enable trusted-device storage in Settings.',true);
    return;
  }
  await signOut(auth);
}
onAuthStateChanged(auth,async user=>{
  const epoch=disposeAccount();
  try{
    if(!user){if(typeof onSignedOut==='function')onSignedOut();signInScreen();return;}
    loadAccountQueue();
    const savedDraft=readTrusted('chatdraft',null);if(savedDraft&&!chatDrafts.has(sessionOwner))chatDrafts.set(sessionOwner,savedDraft);
    await startAccountWorkouts(user,epoch);
  }catch(error){if(epoch===accountEpoch)workoutReadFailure(error,()=>startAccountWorkouts(auth.currentUser,epoch));}
});

window.__pelootyStarted=true;
}
startPelooty().catch(window.pelootyBootFailure);
