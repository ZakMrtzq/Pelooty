<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160C14">
<meta name="description" content="Your private workout companion, progress journal and measurements log.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pelooty</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./tools.css">
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<header class="top">
  <div class="brand"><span class="dot" aria-hidden="true">🍑</span><h1>Pelooty</h1></div>
  <div class="top-actions">
    <button class="sbtn" id="sndBtn" aria-label="Sound" title="Sound">🔊</button>
    <button class="sbtn" id="settingsBtn" aria-label="Settings" title="Settings" hidden>⚙</button>
    <div class="wk" aria-label="Training week"><button id="wkDown" aria-label="Previous week">−</button><div class="lab">Week <b id="wkNum">20</b></div><button id="wkUp" aria-label="Next week">+</button></div>
  </div>
</header>
<div class="statusbar" hidden><div class="live" id="live"><span class="b"></span><span id="liveLbl">Connecting</span></div><span id="saveStatus" role="status" aria-live="polite">Saved</span><button id="retrySave" class="tool-button" hidden>Retry save</button></div>
<div class="clockbar"><span id="clockNow"></span></div>
<div class="presbar" id="presbar"></div>
<div id="appNotice" class="app-notice" role="status" aria-live="polite" hidden></div>
<div class="app-layout"><aside id="rail" aria-label="Workout days" hidden></aside><main id="app" tabindex="-1"><div class="center"><h2>Opening Pelooty…</h2></div></main></div>
<div id="timerDock" hidden></div>
<nav id="nav" aria-label="Main navigation" hidden>
<button data-nav="home"><span aria-hidden="true">◈</span><span>Workouts</span></button>
<button data-nav="calendar"><span aria-hidden="true">▦</span><span>Calendar</span></button>
<button data-nav="chat"><span aria-hidden="true">☏</span><span>Chat <b id="navChatBadge" class="cbadge" hidden></b></span></button>
<button data-nav="games"><span aria-hidden="true">♧</span><span>Games</span></button>
<button data-nav="measurements"><span aria-hidden="true">↔</span><span>Measures</span></button>
</nav>
<footer class="foot" id="foot">Pelooty · Your private training companion</footer><div id="fx" aria-hidden="true"></div>
<noscript><p>This app needs JavaScript to open your training log.</p></noscript>
<script type="module" src="./app.js"></script>
</body></html>
