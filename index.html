<style>

  :root{
    --bg:#160C14; --bg2:#24121F;
    --card:#2A1726; --card2:#351D30; --line:#513047; --line2:#704361;
    --ink:#FFF3FA; --muted:#C9A6BD;
    --accent:#FF85BD; --accent2:#F75DA8; --accent-dim:#60334C; --accent-soft:rgba(255,133,189,.14);
    --done:#6FD9A0; --done-dim:#24463A;
    --blue:#8FB8E8;
    --r:20px; --r-sm:13px; --pad:18px;
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1}
  body{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:calc(44px + env(safe-area-inset-bottom));overflow-x:hidden;
    background:
      radial-gradient(110% 46% at 50% -6%, #4A2039 0%, transparent 60%),
      radial-gradient(90% 40% at 50% 108%, #32172D 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;color:inherit}
  input,textarea{font-size:16px}
  ::selection{background:var(--accent-soft)}
  ::-webkit-scrollbar{width:0;height:0}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,217,160,.55)}70%{box-shadow:0 0 0 7px rgba(111,217,160,0)}100%{box-shadow:0 0 0 0 rgba(111,217,160,0)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(4deg)}}
  @keyframes shim{0%{background-position:-140px 0}100%{background-position:220px 0}}
  @keyframes glowp{0%,100%{box-shadow:0 0 14px rgba(255,133,189,.45)}50%{box-shadow:0 0 26px rgba(255,133,189,.8)}}
  @keyframes popin{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

  /* ===== header ===== */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px var(--pad) 10px;
    background:rgba(22,12,20,.88);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-bottom:1px solid rgba(255,255,255,.05)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .dot{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:21px;
    animation:floaty 4.5s ease-in-out infinite;filter:drop-shadow(0 3px 10px rgba(255,133,189,.35))}
  .brand h1{font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sbtn{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:15px;transition:transform .12s}
  .sbtn:active{transform:scale(.9)}
  .live{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .live .b{width:7px;height:7px;border-radius:50%;background:#5b4f58}
  .live.on .b{background:var(--done);animation:pulse 2s infinite}
  .wk{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
  .wk button{width:30px;height:30px;border-radius:999px;color:var(--muted);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .wk button:active{background:var(--card2);color:var(--accent);transform:scale(.9)}
  .wk .lab{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding:0 7px;min-width:62px;text-align:center}
  .wk .lab b{color:var(--ink)}
  .clockbar{text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em;padding:9px 0 2px}
  .presbar{display:none;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:2px 12px 10px;font-size:12px;color:var(--muted)}
  .pchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pchip b{color:var(--ink);font-weight:650}
  .pchip .plbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
  .pchip .pdot{margin-right:0}
  .pchip.perr{border-color:#7a3b3b;color:#e8a0a0}
  .pchip.psend{border-color:var(--accent);color:var(--ink);cursor:pointer;transition:transform .1s}
  .pchip.psend:active{transform:scale(.94)}
  .stoast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:9500;background:var(--card2);border:1px solid var(--accent);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.45);pointer-events:none}

  /* ===== screens ===== */

  @media (prefers-reduced-motion:reduce){.screen,.day,.ex,.gcard,.klev,.brand .dot,.crit{animation:none!important}*{transition-duration:.01ms!important}}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:10px 2px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

  /* ===== day cards ===== */
  .days{display:flex;flex-direction:column;gap:11px}
  .day{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,var(--card2),var(--card));

    box-shadow:var(--shadow);transition:transform .14s cubic-bezier(.2,.8,.3,1),border-color .14s;animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards}
  .day:active{transform:scale(.975);border-color:var(--accent-dim)}
  .ring{width:50px;height:50px;border-radius:15px;flex:0 0 auto;padding:3px;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*3.6deg),var(--line) 0);transition:background .5s}
  .ring.full{background:conic-gradient(var(--done) 360deg,var(--done) 0);animation:glowp 2.6s ease-in-out infinite}
  .day .ix{width:100%;height:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--bg2)}

  .day .body{flex:1;min-width:0}

  .day .body .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;align-items:center}
  .pill{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
  .pill.hyp{background:var(--accent-soft);color:var(--accent)}
  .pill.neu{background:rgba(111,217,160,.12);color:var(--done)}
  .pill.rest{background:rgba(143,184,232,.12);color:var(--blue)}
  .day .meta{flex:0 0 auto;text-align:right}
  .day .meta .big{font-size:18px;font-weight:800}
  .day .meta .cap{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
  .chev{color:var(--muted);font-size:20px;flex:0 0 auto;opacity:.7}

  /* ===== session ===== */
  .back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:700;padding:8px 0 4px;transition:color .12s}

  .shead .date{font-size:12px;color:var(--muted);white-space:nowrap}
  .ex{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);
    margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.3,1) backwards;transition:border-color .2s}
  .ex.open{border-color:var(--line2)}
  .ex .row{display:flex;align-items:center;gap:12px;padding:15px 16px;width:100%;text-align:left}
  .ex .nm{flex:1;min-width:0}
  .ex .nm .t{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
  .ex .nm .tg{font-size:12px;color:var(--muted);margin-top:3px}
  .badge{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
    background:var(--bg2);color:var(--muted);white-space:nowrap;transition:all .2s}
  .badge.hit{background:var(--done-dim);color:var(--done);animation:popin .35s cubic-bezier(.2,1.4,.3,1)}
  .ex .panel{border-top:1px solid var(--line);padding:15px 16px 16px;display:none;background:rgba(0,0,0,.16)}
  .ex.open .panel{display:block;animation:fade .25s ease}
  .chev2{color:var(--muted);font-size:18px;transition:transform .2s cubic-bezier(.2,.8,.3,1);opacity:.7}
  .ex.open .chev2{transform:rotate(90deg);color:var(--accent);opacity:1}
  .sub-h{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
  .coach-edit{display:grid;grid-template-columns:minmax(110px,1fr) 56px 56px 74px;gap:8px;margin-bottom:15px;align-items:end}
  @media (max-width:370px){.coach-edit{grid-template-columns:1fr 1fr}}
  .cfield{display:flex;flex-direction:column;gap:5px;min-width:0}
  .cfield label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .cfield input,.cfield select{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;font-size:16px;font-weight:600;width:100%;transition:border-color .15s}
  .cfield input:focus,.cfield select:focus{outline:none;border-color:var(--accent)}
  .sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
  .set{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:border-color .15s}
  .set:focus-within{border-color:var(--accent)}
  .set .sx{font-size:12px;color:var(--muted);padding:0 8px}
  .set button{width:36px;height:42px;font-size:18px;font-weight:600;color:var(--muted);transition:all .1s}
  .set button:active{background:var(--card2);color:var(--accent);transform:scale(.88)}
  .set .v{min-width:30px;text-align:center;font-size:16px;font-weight:800}
  .set .v.ok{color:var(--done)}
  .set .vIn{width:52px;height:42px;text-align:center;font-size:16px;font-weight:800;background:transparent;border:none;-moz-appearance:textfield}
  .set .vIn::-webkit-outer-spin-button,.set .vIn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .set .vIn:focus{outline:none;background:var(--card2)}
  .set .vIn.ok{color:var(--done)}
  .set .su{font-size:12px;color:var(--muted);padding:0 8px 0 2px}
  .set .rm{width:30px;height:42px;color:var(--accent2);font-size:14px;opacity:.75}
  .addset{height:42px;padding:0 15px;border:1px dashed var(--line2);border-radius:13px;color:var(--muted);font-size:13px;font-weight:700;transition:all .15s}
  .addset:active{border-color:var(--accent);color:var(--accent);transform:scale(.96)}
  .vol{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg2);border-radius:13px;padding:12px 14px;border:1px solid var(--line)}
  .vol .l{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
  .vol .r{font-size:16px;font-weight:800}
  .vol .r .of{color:var(--muted);font-weight:600;font-size:13px}
  .hint{font-size:12px;margin-top:10px;padding:11px 13px;border-radius:11px;line-height:1.5;transition:all .25s}
  .hint.go{background:var(--done-dim);color:#BFEFD4}
  .hint.wait{background:var(--card2);color:var(--muted)}
  .pnote{margin-top:14px}
  .pnote h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .pnote textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;line-height:1.5;resize:vertical;min-height:52px;transition:border-color .15s}
  .pnote textarea:focus{outline:none;border-color:var(--accent)}
  .pnote+.pnote{margin-top:10px}
  .exdel{margin-top:14px;text-align:right}
  .exdel button{color:var(--accent2);font-size:12px;font-weight:700;opacity:.85}
  .addex{width:100%;border:1px dashed var(--line2);border-radius:var(--r);padding:15px;color:var(--muted);font-size:14px;font-weight:700;margin-bottom:12px;transition:all .15s}
  .addex:active{border-color:var(--accent);color:var(--accent);transform:scale(.985)}
  .addform{background:var(--card2);border:1px solid var(--accent-dim);border-radius:var(--r);padding:16px;margin-bottom:12px;animation:rise .3s ease;box-shadow:var(--shadow)}
  .addform .fr{display:flex;gap:8px;margin-bottom:10px}
  .addform input{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px;width:100%}
  .addform input:focus{outline:none;border-color:var(--accent)}
  .addform .w{width:74px;flex:0 0 auto;text-align:center}
  .addform .acts{display:flex;gap:8px;justify-content:flex-end}
  .addform .acts button{padding:9px 18px;border-radius:11px;font-size:13px;font-weight:800}
  .addform .save{background:var(--grad);color:#2B1020}
  .addform .cancel{color:var(--muted)}

  /* ===== home extras / games ===== */
  .gcard{display:flex;align-items:center;gap:14px;width:100%;background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;text-align:left;margin-top:11px;
    box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,.8,.3,1) backwards;transition:transform .14s,border-color .14s}

  .gcard .gt{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .gcard .gs{font-size:12px;color:var(--muted);margin-top:3px}
  .cbadge{background:var(--grad);color:#2B1020;font-size:12px;font-weight:800;min-width:19px;height:19px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;animation:popin .3s ease}
  .gbar{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:var(--muted)}
  .gbar b{color:var(--ink);font-size:18px;font-weight:800;margin-left:4px}
  .result{text-align:center;padding:26px 10px;animation:rise .4s ease}
  .result .rscore{font-size:56px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  .result .rcap{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .lb{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px;margin:18px auto 0;max-width:340px;text-align:left;box-shadow:var(--shadow)}

  .lb-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .lb-row b{color:var(--accent)}

  .lbv i{font-style:normal;font-size:12px;color:var(--muted)}
  .lb-empty{font-size:13px;color:var(--muted)}
  .racts{display:flex;gap:9px;justify-content:center;margin-top:18px}
  .racts button{padding:11px 22px;border-radius:13px;font-size:14px;font-weight:800;transition:transform .12s}
  .racts button:active{transform:scale(.94)}
  .racts .save{background:var(--grad);color:#2B1020;box-shadow:0 6px 18px rgba(247,93,168,.3)}
  .racts .cancel{color:var(--muted)}
  .rxn{width:100%;height:46vh;border-radius:var(--r);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;transition:background .12s,transform .12s;box-shadow:var(--shadow)}
  .rxn:active{transform:scale(.99)}
  .rxn.wait{background:var(--card2);color:var(--muted)}
  .rxn.go{background:var(--grad);color:#2B1020}

  .rxn.done{background:var(--done-dim);color:#BFEFD4}

  .tstatus{text-align:center;font-size:15px;font-weight:800;margin:2px 0 4px;min-height:22px}
  .ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:310px;margin:14px auto}
  .tcell{aspect-ratio:1;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;font-size:40px;display:flex;align-items:center;justify-content:center;transition:transform .1s,border-color .12s;box-shadow:var(--shadow)}

  .holdpad{width:100%;height:44vh;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));

    touch-action:none;-webkit-user-select:none;user-select:none;transition:background .2s,transform .12s}

  /* ===== kegel ===== */

  .hrow span:first-child{color:var(--ink);font-weight:700}
  .picker{position:fixed;inset:0;z-index:9000;background:rgba(8,5,9,.66);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}

  document.getElementById('signout').onclick=()=>safeSignOut();
  document.getElementById('reloadSavedWorkouts').onclick=reloadSavedWorkouts;
  document.getElementById('progressBtn').onclick=()=>renderProgress();
  document.getElementById('exportBtn').onclick=()=>exportWorkouts();
  document.getElementById('printBtn').onclick=()=>printWeeklySummary();
  app.querySelectorAll('.day').forEach(b=>b.onclick=()=>openDay(+b.dataset.day));
  document.getElementById('nextWorkout').onclick=()=>{const day=nextPlannedDay();if(day)openDay(day.id);};
  startClock();drawChatBadge();updateWeeklySummary();refreshRail();
  const waiting=new Set(PROGRAM.map(day=>day.id)),failures=new Map();
  const readStatus=()=>{
    const el=document.getElementById('workoutReadStatus');if(!el)return;
    el.textContent=waiting.size?'Loading saved workouts…':failures.size?'Some workouts could not be read. Use Reload saved workouts to retry.':'Saved workouts loaded for Week '+wk+'.';
    if(!waiting.size&&failures.size)setTxt('weekCompleted','—');
  };
  PROGRAM.forEach(day=>{
    const failed=error=>{
      if(token!==workoutViewToken||view.screen!=='home'||WEEK!==wk)return;
      waiting.delete(day.id);failures.set(day.id,error);liveOn(false);
      setTxt('dc-'+day.id,'—');setTxt('ec-'+day.id,'Read failed');setTxt('cap-'+day.id,'retry');readStatus();
    };
    const u=onSnapshot(dref(wk,day.id),{includeMetadataChanges:true},snap=>{
      if(token!==workoutViewToken||view.screen!=='home'||WEEK!==wk)return;
      if(!snap.exists()&&snap.metadata?.fromCache&&navigator.onLine&&!state[key(wk,day.id)])return;
      waiting.delete(day.id);failures.delete(day.id);liveOn(!snap.metadata?.fromCache);
      if(!snap.exists()&&(navigator.onLine||!state[key(wk,day.id)])){
        setTxt('dc-'+day.id,navigator.onLine?'0/'+day.ex.length:'Offline');setTxt('ec-'+day.id,navigator.onLine?'No saved session':'Open online to cache');setTxt('cap-'+day.id,'');readStatus();return;

      const d=snap.exists()?acceptSession(wk,day.id,day,raw):raw;state[key(wk,day.id)]=d;

      const ring=document.getElementById('ring-'+day.id);if(ring){ring.style.setProperty('--pct',Math.round(completed/Math.max(1,count)*100));ring.classList.toggle('full',count>0&&completed===count);}
      updateWeeklySummary();refreshRail();readStatus();
    },failed);subs.push(u);
  });
}

function dayCardHTML(day,idx=0){
  const t=day.type==='hyp'?'t-hyp':day.type==='neu'?'t-neu':'t-rest';
  const label=day.type==='hyp'?'Hypertrophy':day.type==='neu'?'Neural':'Rest';

}

async function openDay(id){
  if(!trainingWeekReady)return;
  const token=++workoutViewToken,wk=WEEK,day=PROGRAM.find(d=>d.id===id);
  if(!day)return;
  view={screen:'session',dayId:id};clearSubs();clearGameTimers();renderedIds='';previousWorkout=null;setActiveNav('session');
  app.innerHTML='<div class="screen"><p class="loading-state" role="status">Loading session…</p></div>';
  try{await ensureDay(wk,id);}catch(error){
    if(token!==workoutViewToken)return;liveOn(false);workoutReadFailure(error,()=>openDay(id),'Could not load this workout');return;
  }
  if(token!==workoutViewToken||view.screen!=='session'||view.dayId!==id||WEEK!==wk)return;
  if(!navigator.onLine&&state[key(wk,id)]){renderSession(day);renderedIds=state[key(wk,id)].exercises.map(e=>e.id).join(',');}
  const u=onSnapshot(dref(wk,id),{includeMetadataChanges:true},snap=>{
    if(token!==workoutViewToken||view.screen!=='session'||view.dayId!==id||WEEK!==wk)return;
    liveOn(true);
    if(!snap.exists()&&(navigator.onLine||!state[key(wk,id)])){if(snap.metadata?.fromCache&&navigator.onLine)return;workoutReadFailure({code:'missing-session',message:'This saved session could not be found.'},()=>openDay(id),'Could not load this workout');return;}
    const raw=snap.exists()?snap.data():state[key(wk,id)];if(!Array.isArray(raw?.exercises)){workoutReadFailure({code:'unsupported-data',message:'Saved exercises have an invalid format.'},()=>openDay(id),'Could not load this workout');return;}
    const d=acceptSession(wk,id,day,raw);
    state[key(wk,id)]=d;
    const ids=d.exercises.map(e=>e.id).join(',');
    if(ids!==renderedIds){renderSession(day);renderedIds=ids;}else refreshSession(day);
    refreshRail();
  },error=>{if(token===workoutViewToken){liveOn(false);workoutReadFailure(error,()=>openDay(id),'Could not load this workout');}});
  subs.push(u);
  if(wk>1){
    const cacheKey=key(wk-1,id);
    try{
      let previous=previousWorkoutCache.get(cacheKey);
      if(!previous){const prior=await getDoc(dref(wk-1,id));previous=prior.exists()?prior.data():{exercises:[]};previousWorkoutCache.set(cacheKey,previous);}
      if(token===workoutViewToken&&view.screen==='session'&&view.dayId===id&&WEEK===wk){previousWorkout=previous;updatePreviousComparisons(day);}
    }catch(e){if(token===workoutViewToken){app.querySelectorAll('.previous-session').forEach(el=>el.textContent='Previous session is unavailable.');}}
  }
}

          <div class="structured-load"><div class="cfield"><label for="loadValue-${i}">Numerical load (optional)</label><input id="loadValue-${i}" type="number" inputmode="decimal" min="0" step="0.1" value="${Number.isFinite(e.loadValue)?e.loadValue:''}" placeholder="e.g. 12"/></div><div class="cfield"><label for="loadUnit-${i}">Load unit</label><select id="loadUnit-${i}">${['kg','lb','bodyweight','band'].map(u=>`<option value="${u}"${(e.loadUnit||'kg')===u?' selected':''}>${u}</option>`).join('')}</select></div></div>

        </div></details>

  });
  h+='</div><button class="addex" id="addex">+ Add exercise</button><div id="addslot"></div></div>';app.innerHTML=h;
  document.getElementById('back').onclick=renderHome;bindRestTimer();
  d.exercises.forEach((e,i)=>{
    drawSets(day,i);
    const card=app.querySelector('.ex[data-i="'+i+'"]'),toggle=card.querySelector('.toggle'),panel=card.querySelector('.panel');
    toggle.onclick=()=>{const open=card.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));panel.hidden=!open;};

    bindNum('es-'+i,val=>{const ex=curEx(day,i);if(!ex)return;ex.ts=Math.min(50,Math.max(1,val));while(ex.sets.length<ex.ts)ex.sets.push(blankSet(ex,ex.sets.length));patchEx(day,i);drawSets(day,i);},day);
    bindNum('er-'+i,val=>{const ex=curEx(day,i);if(!ex)return;ex.tr=Math.min(9999,Math.max(1,val));patchEx(day,i);drawSets(day,i);},day);

    bindInput('loadValue-'+i,val=>{const ex=curEx(day,i);if(ex)ex.loadValue=val===''?null:Math.max(0,Number(val)||0);},day);

function curEx(day,i){const d=state[key(WEEK,day.id)];return d&&d.exercises&&d.exercises[i];}
function bindInput(id,fn,day,event='input'){const el=document.getElementById(id);if(!el)return;el.addEventListener(event,()=>{fn(el.value);save(WEEK,day.id);});}
function bindNum(id,fn,day){const el=document.getElementById(id);if(!el)return;el.oninput=()=>{if(el.value===''||!el.validity.valid)return;fn(parseInt(el.value)||1);save(WEEK,day.id);};}

function showAddForm(day){

  slot.innerHTML=`<form class="addform" id="newExercise"><div class="cfield"><label for="ax-n">Exercise name</label><input id="ax-n" required maxlength="150"/></div><div class="add-fields"><div class="cfield"><label for="ax-s">Sets</label><input id="ax-s" type="number" min="1" max="50" value="3" required/></div><div class="cfield"><label for="ax-r">Reps</label><input id="ax-r" type="number" min="1" max="9999" value="10" required/></div><div class="cfield"><label for="ax-l">Load</label><input id="ax-l" placeholder="e.g. 8 kg"/></div></div><div class="acts"><button class="cancel" id="ax-c" type="button">Cancel</button><button class="save" type="submit">Add exercise</button></div></form>`;
  document.getElementById('ax-n').focus();

  document.getElementById('newExercise').onsubmit=ev=>{ev.preventDefault();const d=state[key(WEEK,day.id)],n=document.getElementById('ax-n').value.trim();if(!n)return;
    const s=Math.min(50,Math.max(1,parseInt(document.getElementById('ax-s').value)||1)),r=Math.min(9999,Math.max(1,parseInt(document.getElementById('ax-r').value)||1)),l=document.getElementById('ax-l').value.trim()||'BW';
    d.exercises.push({id:uid(),name:n,ts:s,tr:r,load:l,unit:'reps',loadValue:null,loadUnit:'kg',sets:Array(s).fill(0),cnote:'',anote:''});save(WEEK,day.id);renderSession(day);renderedIds=d.exercises.map(x=>x.id).join(',');
  };
}

function refreshSession(day){
  if(view.screen!=='session'||view.dayId!==day.id)return;
  const d=state[key(WEEK,day.id)];
  d.exercises.forEach((e,i)=>{
    setIfBlur('en-'+i,e.name);setIfBlur('ld-'+i,e.load||'');setIfBlur('es-'+i,e.ts);setIfBlur('er-'+i,e.tr);setIfBlur('loadValue-'+i,Number.isFinite(e.loadValue)?e.loadValue:'');setIfBlur('loadUnit-'+i,e.loadUnit||'kg');setIfBlur('eu-'+i,e.unit);
    setTxt('rl-'+i,isSec(e)?'Seconds':'Reps');setIfBlur('cn-'+i,e.cnote||'');setIfBlur('an-'+i,e.anote||'');
    const cue=document.getElementById('coach-cue-'+i);if(cue){cue.textContent=e.cnote||'';cue.parentElement.hidden=!e.cnote;}
    if(!document.querySelector('#st-'+i+' :focus'))drawSets(day,i);patchEx(day,i);

function setIfBlur(id,val){const el=document.getElementById(id);if(el&&document.activeElement!==el&&el.value!==(val+''))el.value=val;}
function hintText(hi,v,t,word='reps'){if(hi)return '✓ Target completed. Review your next session with your coach.';const need=t-v;return need>0?need+' more '+word+' to reach the target.':'Log each prescribed set to complete the target.';}

function drawSets(day,i){
  const e=curEx(day,i),wrap=document.getElementById('st-'+i);if(!wrap||!e)return;
  const word=unitWord(e);wrap.innerHTML=(e.sets||[]).map((v,si)=>`<div class="logged-set"><div class="set"><label class="sx" for="set-${i}-${si}">Set ${si+1}</label><button data-a="dec" data-s="${si}" aria-label="Decrease ${esc(e.name)} set ${si+1} ${word}">−</button><input id="set-${i}-${si}" class="vIn num${setValue(v)>=e.tr?' ok':''}" type="number" inputmode="numeric" min="0" max="9999" data-s="${si}" value="${setValue(v)}" aria-label="${esc(e.name)} set ${si+1} ${word}"/><button data-a="inc" data-s="${si}" aria-label="Increase ${esc(e.name)} set ${si+1} ${word}">+</button>${e.sets.length>e.ts?`<button class="rm" data-a="rm" data-s="${si}" aria-label="Remove ${esc(e.name)} set ${si+1}">×</button>`:''}${isSec(e)?'<span class="su">sec</span>':''}</div>${structuredSet(v)?'<p class="set-record">'+esc([setLoadText(v),v.rir!=null?'RIR '+v.rir:''].filter(Boolean).join(' · '))+'</p>':''}</div>`).join('')+'<button class="addset" data-a="add">+ Add set</button>';
  wrap.querySelectorAll('.vIn').forEach(inp=>{inp.oninput=()=>{const ex=curEx(day,i);if(!ex||!inp.validity.valid)return;const si=+inp.dataset.s,was=hit(ex);ex.sets[si]=withSetValue(ex.sets[si],Math.min(9999,Math.max(0,parseInt(inp.value)||0)));inp.classList.toggle('ok',setValue(ex.sets[si])>=ex.tr);patchEx(day,i);save(WEEK,day.id);if(!was&&hit(ex))celebrate();};});
  wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{const ex=curEx(day,i);if(!ex)return;const a=b.dataset.a,si=+b.dataset.s,was=hit(ex),step=stepOf(ex);
    if(a==='inc'){ex.sets[si]=withSetValue(ex.sets[si],Math.min(9999,setValue(ex.sets[si])+step));sound('tap');}else if(a==='dec'){ex.sets[si]=withSetValue(ex.sets[si],Math.max(0,setValue(ex.sets[si])-step));sound('tick');}else if(a==='add'){if(ex.sets.length>=50)return;ex.sets.push(blankSet(ex,ex.sets.length));sound('pop');}else if(a==='rm'){ex.sets.splice(si,1);sound('tick');}
    save(WEEK,day.id);drawSets(day,i);patchEx(day,i);const focusTarget=wrap.querySelector('[data-a="'+a+'"][data-s="'+si+'"]')||wrap.querySelector('[data-a="add"]');if(focusTarget)focusTarget.focus({preventScroll:true});if(!was&&hit(ex))celebrate();
  });
}

function patchEx(day,i){
  const e=curEx(day,i);if(!e)return;const v=vol(e),t=tgt(e),hi=hit(e);setTxt('t-'+i,e.name);setTxt('tg-'+i,'Target '+e.ts+' × '+e.tr+suf(e)+' · '+(e.load||''));setTxt('vv-'+i,v);setTxt('tt-'+i,t);setTxt('vl-'+i,isSec(e)?'Total seconds':'Total reps');setTxt('vu-'+i,unitWord(e));
  const bd=document.getElementById('bd-'+i);if(bd){bd.textContent=hi?'Complete':v+'/'+t;bd.classList.toggle('hit',hi);}const hint=document.getElementById('hint-'+i);if(hint){hint.className='hint '+(hi?'go':'wait');hint.textContent=hintText(hi,v,t,unitWord(e));}
}
function setTxt(id,v){const el=document.getElementById(id);if(el)el.textContent=v;}
function updatePreviousComparisons(day){
  const current=state[key(WEEK,day.id)];if(!current)return;
  current.exercises.forEach((e,i)=>{const el=document.getElementById('previous-'+i);if(!el)return;if(WEEK<=1){el.textContent='First programme week';return;}if(!previousWorkout)return;const prev=(previousWorkout.exercises||[]).find(x=>x.name.trim().toLowerCase()===e.name.trim().toLowerCase());el.textContent=prev?'Previous week: '+(prev.sets||[]).map(setValue).join(' / ')+' '+unitWord(prev)+' · '+(prev.load||'BW'):'No matching exercise in the previous week.';});
}

let introShown=false;
function introSplash(){
  if(introShown)return; introShown=true;
  const reduce=reducedMotion();
  if(reduce)return;
  const emo=randEmoji();
  const ov=document.createElement('div'); ov.id='intro';
  const p=document.createElement('div'); p.className='peach'; p.textContent=emo;
  ov.appendChild(p); document.body.appendChild(ov);
  p.animate([
    {transform:'scale(0) rotate(-25deg)',opacity:0,offset:0},
    {transform:'scale(1.12) rotate(12deg)',opacity:1,offset:.16},
    {transform:'scale(1) rotate(-10deg)',opacity:1,offset:.28},
    {transform:'scale(1.07) rotate(9deg)',opacity:1,offset:.4},
    {transform:'scale(1) rotate(-8deg)',opacity:1,offset:.52},
    {transform:'scale(1.06) rotate(7deg)',opacity:1,offset:.64},
    {transform:'scale(1) rotate(-5deg)',opacity:1,offset:.76},
    {transform:'scale(1.05) rotate(4deg)',opacity:1,offset:.88},
    {transform:'scale(1.3) rotate(0deg)',opacity:1,offset:1}
  ],{duration:2600,easing:'cubic-bezier(.3,.7,.3,1)',fill:'forwards'});
  setTimeout(()=>{
    // PUNCH — pops, does not fade

let chatRendered=0,chatMessages=new Map(),chatCursor=null,chatHasMore=true,chatLoadingOlder=false,chatDrafts=new Map(),chatSending=false;
function activeChatDraft(){return chatDrafts.get(sessionOwner)||{text:'',id:''};}
function saveChatDraft(draft){
  if(!sessionOwner)return;chatDrafts.set(sessionOwner,draft);
  try{if(trustedDevice())localStorage.setItem(sessionStorageKey('chatdraft'),JSON.stringify(draft));else localStorage.removeItem(sessionStorageKey('chatdraft'));}catch(e){}
}
function chatFeedback(text,retry=false){
  const el=document.getElementById('chatStatus');if(el)el.textContent=text;
  const b=document.getElementById('chatRetry');if(b)b.hidden=!retry;
  const send=document.getElementById('chatsend');if(send)send.disabled=chatSending;
}
async function sendChatDraft(){
  if(chatSending||!auth.currentUser||view.screen!=='chat')return;
  const input=document.getElementById('chatin');if(!input)return;
  const text=input.value.trim();if(!text)return;
  if(text.length>4000){chatFeedback('Keep messages under 4,000 characters.');return;}
  let draft=activeChatDraft();
  if(draft.text!==text||!draft.id)draft={text,id:uid(),t:Date.now()};
  saveChatDraft(draft);
  if(!navigator.onLine){chatFeedback('Message queued on this device. Send when connected.',true);return;}
  const owner=sessionOwner,epoch=accountEpoch,email=auth.currentUser.email||'';
  chatSending=true;chatFeedback('Sending…');
  try{
    await setDoc(doc(db,'messages',draft.id),{e:email,txt:draft.text,t:draft.t});
    if(epoch!==accountEpoch||owner!==sessionOwner)return;
    const current=document.getElementById('chatin');if(current&&current.value.trim()===draft.text)current.value='';
    const remaining=current?current.value:'';saveChatDraft({text:remaining,id:''});sound('pop');chatFeedback('Sent');
  }catch(e){if(epoch===accountEpoch)chatFeedback('Message could not be sent. Your draft is kept.',true);}
  finally{if(epoch===accountEpoch){chatSending=false;const send=document.getElementById('chatsend');if(send)send.disabled=false;}}
}
function snapshotMessages(snap){const rows=[];snap.forEach(d=>rows.push({...d.data(),id:d.id}));return rows;}
function renderChat(){
  view={screen:'chat',dayId:null};clearSubs();clearGameTimers();chatRendered=0;chatMessages=new Map();chatCursor=null;chatHasMore=true;chatLoadingOlder=false;

  },err=>{if(epoch!==accountEpoch)return;liveOn(false);const empty=document.getElementById('chatempty');if(empty)empty.textContent='Messages are unavailable. Check your connection.';chatFeedback('Chat could not connect. Your draft is kept.');});

async function loadOlderChat(){

function appendChat(msgs,me){
  const wrap=document.getElementById('chatwrap');if(!wrap)return;

    const mine=m.e===me,who=(m.e||'').split('@')[0],el=document.createElement('div');el.className='msg '+(mine?'me':'them');el.dataset.id=id;

  }
  wrap.replaceChildren(frag);chatRendered=seen.size;if(atBottom)wrap.scrollTop=wrap.scrollHeight;

function buildRoutine(d){
  const c=KDIFF[d];const ph=[];ph.push({t:'relax',l:'Get ready \u2014 breathe',s:5});
  for(let i=0;i<c.reps;i++){ph.push({t:'squeeze',l:'Squeeze',s:2});ph.push({t:'release',l:'Let go',s:2});}
  ph.push({t:'prep',l:'Long hold next',s:2});ph.push({t:'hold',l:'Hold the squeeze',s:c.hold});ph.push({t:'release',l:'Release slowly',s:4});
  for(let i=0;i<c.pulses;i++){ph.push({t:'pulse',l:'Pulse!',s:1});ph.push({t:'pulserel',l:'\u00b7',s:1});}
  let used=ph.reduce((a,b)=>a+b.s,0);const target=c.total-20;
  while(used<target){if(target-used>=c.hold+6&&Math.random()<.5){ph.push({t:'prep',l:'Hold next',s:2});ph.push({t:'hold',l:'Hold the squeeze',s:c.hold});ph.push({t:'release',l:'Release',s:4});used+=c.hold+6;}else{ph.push({t:'squeeze',l:'Squeeze',s:2});ph.push({t:'release',l:'Let go',s:2});used+=4;}}
  ph.push({t:'reverse',l:'Reverse kegel \u2014 relax & gently bear down',s:20});
  return ph;
}
function startKegel(d){

  const orb=document.getElementById('korb'),otx=document.getElementById('korbtxt'),lab=document.getElementById('kphase'),cnt=document.getElementById('kcount'),fill=document.getElementById('kfill');
  function setOrb(p){
    let sc=1,col='var(--accent)',td=p.s;
    if(p.t==='squeeze'||p.t==='hold'||p.t==='prep'){sc=0.6;col='var(--accent)';td=(p.t==='hold'?0.6:0.7);}
    else if(p.t==='release'){sc=1.15;col='#EBA5C6';td=Math.min(2,p.s);}
    else if(p.t==='relax'||p.t==='reverse'){sc=1.55;col='var(--done-dim)';td=1.4;}

    orb.style.color=(p.t==='relax'||p.t==='reverse')?'var(--ink)':'#2B1020';
    otx.textContent=(p.t==='hold'||p.t==='squeeze'||p.t==='pulse')?'SQUEEZE':(p.t==='reverse'||p.t==='relax')?'RELAX':(p.t==='release'||p.t==='pulserel')?'let go':'';
    if(p.t==='squeeze'||p.t==='pulse')sound('squeeze');else if(p.t==='hold')sound('hold');else if(p.t==='release'||p.t==='pulserel')sound('release');else if(p.t==='relax'||p.t==='reverse')sound('relax');
    if(navigator.vibrate){if(p.t==='squeeze'||p.t==='pulse')navigator.vibrate(35);else if(p.t==='hold')navigator.vibrate(80);}

  function showCritter(on){ const c=document.getElementById('kcrit'); if(!c)return;

      c.animate([{transform:'translateX(-50%) translateY(14px) scale(.5)',opacity:0},{transform:'translateX(-50%) translateY(0) scale(1)',opacity:1}],{duration:320,easing:'cubic-bezier(.2,1.5,.3,1)'});
    } else { c.style.display='none'; c.innerHTML=''; } }
  function run(){

      if(left<=0){clearInterval(iv);if(bt)clearInterval(bt);showCritter(false);idx++;run();}else cnt.textContent=left;},1000);
    gameTimers.push(iv);
  }

}

const SND={ctx:null,muted:false};
try{SND.muted=localStorage.getItem('pel_snd')==='0';}catch(e){}
function sndIcon(){const b=document.getElementById('sndBtn');if(b)b.innerHTML=SND.muted?'&#128263;':'&#128266;';}
function sndInit(){ if(SND.ctx)return; try{const AC=window.AudioContext||window.webkitAudioContext; if(AC)SND.ctx=new AC();}catch(e){} }
document.addEventListener('pointerdown',()=>{ sndInit(); if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume().catch(()=>{}); },{passive:true});
(function(){const b=document.getElementById('sndBtn'); if(b){ sndIcon(); b.onclick=()=>{SND.muted=!SND.muted; try{localStorage.setItem('pel_snd',SND.muted?'0':'1');}catch(e){} sndIcon(); if(!SND.muted)sound('tap');};}})();
function tone(f0,f1,dur,type,vol,when){ const c=SND.ctx; if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine';
  const t=c.currentTime+(when||0);
  o.frequency.setValueAtTime(f0,t); if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,fStart,fEnd){ const c=SND.ctx; if(!c)return;
  const n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource();src.buffer=buf;
  const f=c.createBiquadFilter();f.type='lowpass';const t=c.currentTime;
  f.frequency.setValueAtTime(fStart||3200,t); f.frequency.exponentialRampToValueAtTime(fEnd||420,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f).connect(g).connect(c.destination);src.start(t);src.stop(t+dur+0.03);
}
function sound(name){
  if(SND.muted)return; sndInit(); const c=SND.ctx; if(!c)return;
  if(c.state==='suspended'){c.resume().catch(()=>{});}
  try{ switch(name){
    case 'tap': tone(660,760,0.06,'sine',0.1); break;
    case 'tick': tone(420,360,0.05,'sine',0.08); break;
    case 'pop': tone(520,880,0.09,'triangle',0.12); break;
    case 'msg': tone(740,988,0.12,'sine',0.11); tone(988,740,0.1,'sine',0.07,0.09); break;
    case 'success': tone(659,659,0.11,'sine',0.13); tone(880,880,0.13,'sine',0.13,0.1); tone(1175,1175,0.2,'sine',0.11,0.2); break;
    case 'win': tone(523,523,0.12,'triangle',0.12); tone(659,659,0.12,'triangle',0.12,0.11); tone(784,784,0.12,'triangle',0.12,0.22); tone(1047,1047,0.26,'triangle',0.12,0.33); break;
    case 'splash': noise(0.55,0.24,3600,300); tone(240,120,0.4,'sine',0.08); break;
    case 'squeeze': tone(520,560,0.1,'sine',0.12); break;
    case 'hold': tone(600,640,0.28,'sine',0.1); break;
    case 'release': tone(420,260,0.18,'sine',0.1); break;
    case 'relax': tone(300,240,0.5,'sine',0.07); break;
  } }catch(e){}
}

let splashSeenT=0, splashCoolUntil=0, splashCounts={}, splashWatchStarted=false;

function startSplashWatch(){

    measurementEntries=measurementSort(measurementEntries.filter(x=>x.id!==entry.id).concat(entry));
    measurementEditing=null;measurementDraft=null;measurementDeleted=null;measurementWrite();renderMeasurements();
  };
  document.getElementById('measurement-units').onchange=e=>{
    const next=measurementCaptureForm();if(!next.ok){e.target.value=measurementUnit;return measurementFormError(next.message,next.field);}
    measurementDraft={date:next.date,notes:next.notes,values:next.values};measurementUnit=e.target.value;
    if(!blocked)measurementWrite();renderMeasurements();
  };
  document.getElementById('measurement-trend').onchange=e=>{
    const next=measurementCaptureForm();if(next.ok)measurementDraft={date:next.date,notes:next.notes,values:next.values};
    measurementMetric=e.target.value;renderMeasurements();
  };
  document.getElementById('measurement-cancel')?.addEventListener('click',()=>{measurementEditing=null;measurementDraft=null;renderMeasurements();});
  document.getElementById('measure-retry')?.addEventListener('click',()=>{const next=measurementCaptureForm();if(next.ok)measurementDraft={date:next.date,notes:next.notes,values:next.values};measurementWrite();renderMeasurements();});
  document.getElementById('measure-export').onclick=exportMeasurements;
  document.getElementById('measurement-undo')?.addEventListener('click',()=>{measurementEntries=measurementSort(measurementEntries.concat(measurementDeleted));measurementTrash=measurementTrash.filter(e=>e.id!==measurementDeleted.id);measurementDeleted=null;measurementWrite();renderMeasurements();});
  app.querySelectorAll('[data-measure-edit]').forEach(b=>b.onclick=()=>{
    const e=measurementEntries.find(x=>x.id===b.dataset.measureEdit);if(!e)return;
    measurementEditing=e.id;measurementDraft={date:e.date,notes:e.notes,values:{...e.values}};renderMeasurements();document.getElementById('measurement-date').focus();
  });
  app.querySelectorAll('[data-measure-restore]').forEach(b=>b.onclick=()=>{
    const entry=measurementTrash.find(x=>x.id===b.dataset.measureRestore);if(!entry)return;
    const draft=measurementCaptureForm();if(draft.ok)measurementDraft={date:draft.date,notes:draft.notes,values:draft.values};
    measurementEntries=measurementSort(measurementEntries.filter(x=>x.id!==entry.id).concat(entry));measurementTrash=measurementTrash.filter(x=>x.id!==entry.id);
    if(measurementDeleted?.id===entry.id)measurementDeleted=null;measurementWrite();renderMeasurements();
  });
  app.querySelectorAll('[data-measure-delete]').forEach(b=>b.onclick=()=>{
    const entry=measurementEntries.find(x=>x.id===b.dataset.measureDelete);if(!entry)return;
    const draft=measurementCaptureForm();if(draft.ok)measurementDraft={date:draft.date,notes:draft.notes,values:draft.values};
    measurementDeleted=entry;measurementTrash=measurementTrash.filter(x=>x.id!==entry.id).concat(entry);measurementEntries=measurementEntries.filter(x=>x.id!==entry.id);
    if(measurementEditing===entry.id){measurementEditing=null;measurementDraft=null;}measurementWrite();renderMeasurements();
  });
}
function pelootyCSVCell(value){
  let text=value==null?'':String(value);
  if(/^\s*[=+@-]/.test(text)||/^[\t\r\n]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
}
function pelootyCSV(rows){return '\uFEFF'+rows.map(row=>row.map(pelootyCSVCell).join(',')).join('\r\n')+'\r\n';}
function pelootyDownloadCSV(filename,rows,fallbackId){
  const csv=pelootyCSV(rows);
  try{
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){
    const host=document.getElementById(fallbackId)||app;
    const box=document.createElement('div');box.className='measure-card';
    const label=document.createElement('label');label.textContent='Copy this CSV into a text file named '+filename;label.className='measure-label';
    const textarea=document.createElement('textarea');textarea.className='measure-export-fallback';textarea.readOnly=true;textarea.value=csv;label.appendChild(textarea);box.appendChild(label);host.appendChild(box);textarea.focus();textarea.select();
  }
  return csv;
}
function exportMeasurements(){
  const rows=[['Date','Weight ('+measurementUnits(MEASURE_FIELDS[0])+')',...MEASURE_FIELDS.slice(1).map(f=>f.label+' ('+measurementUnits(f)+')'),'Notes']];
  measurementSort(measurementEntries).reverse().forEach(e=>rows.push([e.date,...MEASURE_FIELDS.map(f=>e.values[f.key]==null?'':Number(measurementFromCanonical(e.values[f.key],f).toFixed(4))),e.notes]));
  return pelootyDownloadCSV('pelooty-measurements-'+ymd(new Date())+'.csv',rows,'measure-export-fallback');
}

/* Workout history is read from the existing sessions collection when requested. */
function progressSessionRows(records){
  const rows=[];
  for(const record of records){
    const match=/^w(\d+)-d(\d+)$/.exec(record.id);if(!match)continue;
    const week=+match[1],dayId=+match[2],day=PROGRAM.find(d=>d.id===dayId);
    for(const e of (Array.isArray(record.data?.exercises)?record.data.exercises:[])){
      if(!e||typeof e.name!=='string')continue;
      const sets=(Array.isArray(e.sets)?e.sets:[]).map(setValue),unit=e.unit==='sec'?'sec':'reps';
      const setLoads=(Array.isArray(e.sets)?e.sets:[]).filter(s=>structuredSet(s)&&['kg','lb'].includes(s.loadUnit)&&s.loadValue!=null&&Number.isFinite(Number(s.loadValue))&&Number(s.loadValue)>0);
      const topLoad=setLoads.reduce((best,s)=>!best||Number(s.loadValue)*(s.loadUnit==='lb'?.45359237:1)>Number(best.loadValue)*(best.loadUnit==='lb'?.45359237:1)?s:best,null);
      rows.push({week,dayId,day:day?day.name:'Day '+dayId,id:e.id,name:e.name,sets,setRecords:cloneData(Array.isArray(e.sets)?e.sets:[]),total:sets.reduce((a,b)=>a+b,0),unit,load:typeof e.load==='string'?e.load:'',loadValue:Number.isFinite(Number(e.loadValue))&&Number(e.loadValue)>0?Number(e.loadValue):topLoad?Number(topLoad.loadValue):null,loadUnit:e.loadUnit||topLoad?.loadUnit||'',targetSets:Number(e.ts)||0,targetReps:Number(e.tr)||0,coachNote:e.cnote||'',athleteNote:e.anote||''});
    }
  }
  return rows.sort((a,b)=>a.week-b.week||a.dayId-b.dayId||a.name.localeCompare(b.name));
}
async function loadProgressRecords(force=false){
  const owner=measurementOwner();if(!owner)throw new Error('Sign in to view workout history.');
  if(!force&&progressCache&&progressAccount===owner&&Date.now()-progressCache.at<60000)return progressMergeState(progressCache.records);
  const snap=await getDocs(collection(db,'sessions'));
  if(measurementOwner()!==owner)throw new Error('The account changed. Open history again.');
  const records=[];snap.forEach(d=>records.push({id:d.id,data:d.data()}));
  progressAccount=owner;progressCache={at:Date.now(),records};return progressMergeState(records);
}
function progressMergeState(records){
  const byId=new Map(records.map(r=>[r.id,r]));
  for(const [id,data]of Object.entries(state||{}))if(/^w\d+-d\d+$/.test(id))byId.set(id,{id,data});
  return [...byId.values()];
}
let progressSelected='',progressMetric='total';
async function renderProgress(name){
  if(!measurementOwner())return signInScreen();
  clearSubs();clearGameTimers();view={screen:'progress',dayId:null};setActiveNav('home');measurementStyle();
  const request=++progressRequest,owner=measurementOwner();if(name)progressSelected=name;
  app.innerHTML='<div class="screen"><button class="back" id="progress-back">‹ Workouts</button><div class="shead"><h2>Exercise history</h2></div><p class="measure-note" role="status">Loading workout history…</p></div>';
  document.getElementById('progress-back').onclick=renderHome;
  try{
    const records=await loadProgressRecords();
    if(request!==progressRequest||owner!==measurementOwner()||view.screen!=='progress')return;
    drawProgress(progressSessionRows(records));
  }catch(e){
    if(request!==progressRequest||view.screen!=='progress')return;
    app.innerHTML='<div class="screen"><button class="back" id="progress-back">‹ Workouts</button><div class="shead"><h2>Exercise history</h2></div><p class="measure-error" role="alert">Workout history could not be loaded. Check your connection and access, then retry.</p><button class="measure-primary" id="progress-retry">Retry</button></div>';
    document.getElementById('progress-back').onclick=renderHome;document.getElementById('progress-retry').onclick=()=>renderProgress(progressSelected);
  }
}
function progressLoadText(row){return row.loadValue!=null&&row.loadUnit&&['kg','lb'].includes(row.loadUnit)?measurementNumber(row.loadValue)+' '+row.loadUnit:(row.load||'Bodyweight');}
function progressChartValue(row){
  if(progressMetric==='load')return row.loadValue==null||!['kg','lb'].includes(row.loadUnit)?null:row.loadValue*(row.loadUnit==='lb'?.45359237:1);
  return row.total;
}
function drawProgress(rows){
  const names=[...new Set(rows.map(r=>r.name))].sort((a,b)=>a.localeCompare(b));
  if(!names.includes(progressSelected))progressSelected=names[0]||'';
  const selected=rows.filter(r=>r.name===progressSelected),unit=selected.at(-1)?.unit||'reps';
  const chartRows=selected.filter(r=>progressMetric==='load'||r.unit===unit).map(r=>({label:'W'+r.week+' D'+r.dayId,value:progressChartValue(r)})).filter(r=>r.value!=null);
  let h='<div class="screen"><button class="back" id="progress-back">‹ Workouts</button><div class="shead"><h2>Exercise history</h2></div><p class="measure-note">Compare recorded sets and loads across your saved weeks. History is loaded when you open this view.</p><div class="measure-toolbar"><button type="button" id="progress-export"'+(rows.length?'':' disabled')+'>Export workout CSV</button><button type="button" id="progress-refresh">Refresh</button></div><div id="progress-export-error" class="measure-error" role="alert"></div>';
  if(!names.length)h+='<div class="progress-card"><p class="measure-empty">Your exercise history will appear after you save workout sets.</p></div>';
  else{
    h+='<div class="progress-card"><div class="measure-grid"><div class="measure-field"><label for="progress-exercise">Exercise</label><select id="progress-exercise">'+names.map(n=>'<option'+(n===progressSelected?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div><div class="measure-field"><label for="progress-metric">Chart</label><select id="progress-metric"><option value="total"'+(progressMetric==='total'?' selected':'')+'>Total '+unit+'</option><option value="load"'+(progressMetric==='load'?' selected':'')+'>Load (kg equivalent)</option></select></div></div>';
    const last=selected.at(-1),prev=selected.slice(0,-1).reverse().find(r=>r.unit===last.unit),change=prev?last.total-prev.total:null;
    h+='<div class="measure-summary"><div><span>Latest total</span><b>'+measurementNumber(last.total)+' '+last.unit+'</b></div><div><span>Latest load</span><b>'+esc(progressLoadText(last))+'</b></div><div><span>Change from previous</span><b>'+(change==null?'First entry':(change>0?'+':'')+measurementNumber(change)+' '+last.unit)+'</b></div></div>';
    h+=chartRows.length?measurementChart(chartRows,progressMetric==='load'?'Recorded load (kg equivalent)':'Recorded '+unit,'progress-chart'):'<p class="measure-empty">Add a numerical load and its unit to chart load history.</p>';
    h+='<div class="measure-table-wrap" role="region" aria-label="Exercise history data" tabindex="0"><table class="measure-table"><caption>'+esc(progressSelected)+' records</caption><thead><tr><th scope="col">Week / day</th><th scope="col">Sets</th><th scope="col">Total</th><th scope="col">Load</th></tr></thead><tbody>'+selected.slice().reverse().map(r=>'<tr><td>Week '+r.week+' · Day '+r.dayId+'</td><td>'+r.sets.map(measurementNumber).join(' / ')+'</td><td>'+measurementNumber(r.total)+' '+r.unit+'</td><td>'+esc(progressLoadText(r))+'</td></tr>').join('')+'</tbody></table></div></div>';
  }
  app.innerHTML=h+'<div id="progress-export-fallback"></div></div>';
  document.getElementById('progress-back').onclick=renderHome;
  document.getElementById('progress-exercise')?.addEventListener('change',e=>{progressSelected=e.target.value;drawProgress(rows);});
  document.getElementById('progress-metric')?.addEventListener('change',e=>{progressMetric=e.target.value;drawProgress(rows);});
  document.getElementById('progress-refresh').onclick=()=>{progressCache=null;renderProgress(progressSelected);};
  document.getElementById('progress-export').onclick=()=>exportWorkouts(rows);
}
async function exportWorkouts(existingRows){
  const owner=measurementOwner();if(!owner)return;
  let rows;
  try{rows=Array.isArray(existingRows)?existingRows:progressSessionRows(await loadProgressRecords());}
  catch(e){
    const el=document.getElementById('progress-export-error');
    if(el)el.textContent='Workout export could not be loaded. Check your connection and retry.';
    else if(typeof splashToast==='function')splashToast('Workout export could not be loaded. Open Exercise history to retry.');
    return;
  }
  if(owner!==measurementOwner())return;
  const csv=[['Week','Day','Workout','Exercise','Set','Recorded value','Unit','Target sets','Target per set','Load description','Numerical load','Load unit','Coach note','Athlete note','RIR']];
  for(const r of rows)r.sets.forEach((value,index)=>{const set=r.setRecords?.[index];csv.push([r.week,r.dayId,r.day,r.name,index+1,value,r.unit,r.targetSets,r.targetReps,setLoadText(set,r.load),structuredSet(set)?set.loadValue:r.loadValue,structuredSet(set)?set.loadUnit:r.loadUnit,r.coachNote,r.athleteNote,structuredSet(set)?set.rir:null]);});
  return pelootyDownloadCSV('pelooty-workouts-'+ymd(new Date())+'.csv',csv,'progress-export-fallback');
}

initialiseShell();
function esc(s){return (s+'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let trainingWeekReady=false,trainingLoadAttempt=0;
function validTrainingWeek(value){const n=Number(value);return Number.isSafeInteger(n)&&n>=1?n:null;}
function trainingWeekStorageKey(){return 'pelooty_training_week_'+encodeURIComponent(currentAccountKey());}
function rememberTrainingWeek(wk){try{localStorage.setItem(trainingWeekStorageKey(),String(wk));}catch{}}
function setWeek(w){
  if(!auth.currentUser||!trainingWeekReady)return;
  const next=validTrainingWeek(w);if(next==null)return;
  const epoch=accountEpoch;WEEK=next;rememberTrainingWeek(next);document.getElementById('wkNum').textContent=WEEK;
  setDoc(doc(db,'meta','app'),{week:next},{merge:true}).catch(error=>{if(epoch===accountEpoch)toolNotice('This week opened, but the shared training week could not be saved. '+(error?.code||'Please reconnect and retry.'),true);});
  if(view.screen==='session')openDay(view.dayId);else renderHome();
}
function workoutReadFailure(error,retry,title='Could not load workouts'){
  const code=String(error?.code||'read-failed');
  const message=code==='permission-denied'?'This account could not read the saved workout data. Check account access and retry.':code==='offline-uncached'?'Connect to load the current training week.':'The saved workout data could not be read. Check your connection and retry.';
  app.innerHTML='<div class="screen"><div class="center"><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p><button class="tool-button primary" id="workoutReadRetry">Retry loading</button><button class="back" id="workoutReadSignOut">Sign out</button><details style="margin-top:18px"><summary>Technical details</summary><p style="margin-top:12px">'+esc(code+': '+(error?.message||'The read failed.'))+'</p></details></div></div>';
  document.getElementById('workoutReadRetry').onclick=retry;
  document.getElementById('workoutReadSignOut').onclick=safeSignOut;
}
async function restoreTrainingWeek(epoch){
  const attempt=++trainingLoadAttempt;trainingWeekReady=false;
  for(const id of ['nav','settingsBtn']){const el=document.getElementById(id);if(el)el.hidden=true;}
  const controls=document.querySelector('.wk');if(controls)controls.hidden=true;
  view={screen:'loading-workouts',dayId:null};
  app.innerHTML='<div class="center"><h2>Loading your workouts…</h2><p role="status">Reading the saved training week.</p></div>';
  try{
    let wk;
    if(navigator.onLine){
      const metadata=await getDoc(doc(db,'meta','app'));
      if(epoch!==accountEpoch||attempt!==trainingLoadAttempt)return false;
      wk=metadata.exists()?validTrainingWeek(metadata.data().week):null;
      if(metadata.exists()&&wk==null)throw Object.assign(new Error('The saved current week has an invalid value.'),{code:'invalid-training-week'});
      if(wk==null)wk=20;
    }else{
      let remembered=null;try{remembered=validTrainingWeek(localStorage.getItem(trainingWeekStorageKey()));}catch{}
      const cached=Object.keys(state).map(k=>/^w(\d+)-d\d+$/.exec(k)).filter(Boolean).map(m=>+m[1]);
      wk=remembered|| (cached.length?Math.max(...cached):null);
      if(wk==null)throw Object.assign(new Error('No saved training week is available on this device.'),{code:'offline-uncached'});
    }
    if(epoch!==accountEpoch||attempt!==trainingLoadAttempt)return false;
    WEEK=wk;rememberTrainingWeek(wk);trainingWeekReady=true;
    const label=document.getElementById('wkNum');if(label)label.textContent=WEEK;
    if(controls)controls.hidden=false;return true;
  }catch(error){
    if(epoch===accountEpoch&&attempt===trainingLoadAttempt)workoutReadFailure(error,()=>startAccountWorkouts(auth.currentUser,epoch));
    return false;
  }
}
async function startAccountWorkouts(user,epoch){
  if(!user||epoch!==accountEpoch)return;
  const ready=await restoreTrainingWeek(epoch);if(!ready||epoch!==accountEpoch)return;
  const live=document.getElementById('live');if(live)live.style.display='';
  if(typeof onSignedIn==='function')onSignedIn(user);
  startClock();startPresence();startChatWatch();startSplashWatch();renderHome();flushSaves();if(!reducedMotion())introSplash();
}
async function reloadSavedWorkouts(){
  if(!auth.currentUser)return;
  clearSubs();clearGameTimers();resetWorkoutView();
  await startAccountWorkouts(auth.currentUser,accountEpoch);
}
document.getElementById('wkUp').onclick=()=>setWeek(WEEK+1);
document.getElementById('wkDown').onclick=()=>setWeek(WEEK-1);

function handleErr(e){
  if(e&&e.code==="permission-denied"){clearSubs();
    app.innerHTML='<div class="center"><h2>No access</h2><p>This account isn\u2019t on the allow-list. Ask the coach to add your email to the Firestore rules.</p><button class="gbtn" id="so2">Use a different account</button></div>';
    const b=document.getElementById('so2');if(b)b.onclick=safeSignOut;}
}
const isMobile=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
function doSignIn(){
  if(isMobile){ signInWithRedirect(auth,provider); return; }
  signInWithPopup(auth,provider).catch(e=>{
    const c=e&&e.code||'';
    if(c.indexOf('popup')>=0||c==='auth/operation-not-supported-in-this-environment'||c==='auth/cancelled-popup-request'){ signInWithRedirect(auth,provider); }
    else alert(e.message||e);
  });
}
getRedirectResult(auth).catch(e=>{ console.warn('redirect',e); if(e&&e.code==='auth/unauthorized-domain'){ alert('This site\u2019s web address isn\u2019t authorised in Firebase yet. Add it under Authentication \u2192 Settings \u2192 Authorized domains.'); } });
function signInScreen(){
  for(const id of ['nav','rail']){const el=document.getElementById(id);if(el)el.hidden=true;}
  const live=document.getElementById('live');if(live)live.style.display='none';
  const week=document.querySelector('.wk');if(week)week.hidden=true;
  app.innerHTML='<div class="center"><h2>Pelooty 🍑</h2><p>Private coaching log. Sign in to continue.</p><button class="gbtn" id="gin"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 4.75c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 1.46 14.97.5 12 .5A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.3 9.14 4.75 12 4.75z"/></svg>Sign in with Google</button></div>';
  document.getElementById('gin').onclick=doSignIn;
}

function disposeAccount(){
  persistSessionQueue();accountEpoch++;trainingWeekReady=false;trainingLoadAttempt++;
  clearSubs();clearGameTimers();
  for(const timer of Object.values(saveT))clearTimeout(timer);saveT={};
  for(const dispose of accountDisposers){try{dispose();}catch(e){}}accountDisposers=[];
  state={};sessionObserved={};sessionPending={};sessionBusy={};sessionOwner='';renderedIds='';
  presenceStarted=false;presenceData={};presenceErr='';clockStarted=false;clearInterval(clockInterval);clockInterval=null;
  chatWatchStarted=false;allChat=[];lastReadChat=0;lastReadWrite=0;unreadChat=0;chatMaxSeen=0;chatRendered=0;chatMessages=new Map();chatCursor=null;chatSending=false;
  splashSeenT=0;splashCoolUntil=0;splashCounts={};splashWatchStarted=false;introShown=false;
  const presence=document.getElementById('presbar');if(presence){presence.innerHTML='';presence.style.display='none';}
  const clock=document.getElementById('clockNow');if(clock)clock.textContent='';
  drawSaveStatus();return accountEpoch;
}
async function safeSignOut(){
  await flushSaves();
  if(!sessionQueueDurable&&Object.values(sessionPending).some(x=>x.ops?.length)){
    if(typeof toolNotice==='function')toolNotice(trustedDevice()?'Your changes are queued, and browser storage is unavailable. Keep this tab open and reconnect before signing out.':'Your changes are still queued in this tab. Reconnect and retry before signing out, or enable trusted-device storage in Settings.',true);
    return;
  }
  await signOut(auth);
}
onAuthStateChanged(auth,async user=>{
  const epoch=disposeAccount();
  try{
    if(!user){if(typeof onSignedOut==='function')onSignedOut();signInScreen();return;}
    loadAccountQueue();
    const savedDraft=readTrusted('chatdraft',null);if(savedDraft&&!chatDrafts.has(sessionOwner))chatDrafts.set(sessionOwner,savedDraft);
    await startAccountWorkouts(user,epoch);
  }catch(error){if(epoch===accountEpoch)workoutReadFailure(error,()=>startAccountWorkouts(auth.currentUser,epoch));}
});

window.__pelootyStarted=true;
}
startPelooty().catch(window.pelootyBootFailure);
